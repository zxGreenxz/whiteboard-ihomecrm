<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>CRM</title>
    <meta name="description" content="Cập nhật realtime · đầy đủ thông tin phòng & vị trí toà nhà" />
    <meta name="author" content="CRM" />

    <!-- Splash tức thì: nền brand + logo ngay từ paint đầu tiên, tránh MÀN ĐEN
         khi chunk JS đang tải (đặc biệt standalone iOS dark mode). React gọi
         hideAppSplash() khi trang đầu mount (xem src/lib/appSplash.ts). -->
    <style>
      html, body { margin: 0; background: #f5f3ee; }
      #app-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 24px; background: #f5f3ee;
        opacity: 1; transition: opacity .28s ease;
      }
      #app-splash .as-logo {
        width: 84px; height: 84px; border-radius: 21px;
        background: linear-gradient(150deg, #21845a, #176244);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 38px rgba(27, 24, 19, .18), 0 4px 12px rgba(27, 24, 19, .10);
      }
      #app-splash .as-logo svg { width: 44px; height: 44px; }
      #app-splash .as-spin {
        width: 24px; height: 24px; border-radius: 50%;
        border: 3px solid rgba(23, 98, 68, .18); border-top-color: #176244;
        animation: as-spin .8s linear infinite;
      }
      @keyframes as-spin { to { transform: rotate(360deg); } }
    </style>

    <!-- PWA / Thêm vào màn hình chính → chạy full-screen như app (ẩn thanh
         địa chỉ + thanh công cụ trình duyệt). viewport-fit=cover bật các
         env(safe-area-inset-*) mà các trang mobile đã dùng sẵn. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRM" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />

    <!-- iOS launch screens: bỏ màn trắng nhấp nháy khi mở app từ MH chính.
         Khớp theo device-width/height (CSS px) + dpr + portrait. Máy không khớp
         → fallback nền trắng (vô hại). Ảnh splash-* generate sẵn trong public/. -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash-640x1136.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-1242x2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash-1536x2048.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash-1640x2360.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash-2048x2732.png" />

    <meta property="og:title" content="Danh sách phòng trống realtime" />
    <meta property="og:description" content="Cập nhật realtime · đầy đủ thông tin phòng & vị trí toà nhà" />
    <meta property="og:type" content="website" />

    <meta property="og:image:width" content="1731" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ptcrm.vercel.app/og-image.png" />

    <!-- Fonts gộp 1 request (tránh CSS @import render-blocking + nối tiếp trong
         các kit mobile): Baloo 2 (nhãn QR) + Be Vietnam Pro + Space Mono (app kit). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div class="as-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />

          <path d="M10 6h4" /><path d="M10 10h4" /><path d="M10 14h4" /><path d="M10 18h4" />
        </svg>
      </div>
      <div class="as-spin"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>CRM</title>
    <meta name="description" content="Cập nhật realtime · đầy đủ thông tin phòng & vị trí toà nhà" />
    <meta name="author" content="CRM" />

    <!-- PWA / Thêm vào màn hình chính → chạy full-screen như app (ẩn thanh
         địa chỉ + thanh công cụ trình duyệt). viewport-fit=cover bật các
         env(safe-area-inset-*) mà các trang mobile đã dùng sẵn. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRM" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />

    <meta property="og:title" content="Danh sách phòng trống realtime" />
    <meta property="og:description" content="Cập nhật realtime · đầy đủ thông tin phòng & vị trí toà nhà" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ptcrm.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ptcrm.vercel.app/og-image.png" />

    <!-- Font "dễ thương" cho nhãn phòng/toà nhà ở QR dialog (hỗ trợ tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

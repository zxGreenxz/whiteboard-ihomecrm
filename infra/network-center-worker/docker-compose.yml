services:
  network-center-worker:
    image: ${NETWORK_CENTER_IMAGE_REF:?set NETWORK_CENTER_IMAGE_REF to the inspected immutable image}
    pull_policy: never
    container_name: ${NETWORK_CENTER_CONTAINER_NAME:-ihome-network-center-worker}
    user: "10001:10001"
    init: true
    network_mode: host
    restart: ${NETWORK_CENTER_RESTART_POLICY:-unless-stopped}
    read_only: true
    stop_grace_period: 5m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    volumes:
      - type: bind
        source: ${NETWORK_CENTER_RUNTIME_SECRET_DIR_HOST:?set NETWORK_CENTER_RUNTIME_SECRET_DIR_HOST}
        target: /run/secrets/network-center
        read_only: true
      - type: bind
        source: ${NETWORK_CENTER_BACKUP_DIR_HOST:?set NETWORK_CENTER_BACKUP_DIR_HOST}
        target: /var/lib/network-center/backups
    env_file:
      - path: ${NETWORK_CENTER_ENV_FILE:?set NETWORK_CENTER_ENV_FILE}
        required: true
    environment:
      NODE_OPTIONS: "--max-old-space-size=320"
      NETWORK_CENTER_WORKER_SECRET_FILE: /run/secrets/network-center/worker-secret
      NETWORK_CENTER_CREDENTIALS_FILE: /run/secrets/network-center/router-credentials.json
      NETWORK_CENTER_BACKUP_DIR: /var/lib/network-center/backups
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

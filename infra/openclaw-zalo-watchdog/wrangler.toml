name = "openclaw-zalo-watchdog"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "WATCHDOG_STATE"
class_name = "WatchdogState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchdogState"]

# Secrets configured with `wrangler secret put`:
# OPENCLAW_WATCHDOG_EDGE_URL, OPENCLAW_WATCHDOG_BEARER_TOKEN,
# OPENCLAW_WATCHDOG_ORGANIZATION_ID. The endpoint is the only network target.

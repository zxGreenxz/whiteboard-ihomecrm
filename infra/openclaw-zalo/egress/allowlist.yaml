version: 1
destinations:
  - host: tryymsxyyckgbrmmvozx.supabase.co
    port: 443
    purpose: supabase control plane
  - host: openclaw-media.chillhome.io.vn
    port: 443
    purpose: private media gateway
  - host: ai.chillhome.io.vn
    port: 443
    purpose: independent model provider
  - host: openclaw.chillhome.io.vn
    port: 443
    purpose: OpenClaw control endpoint
  # Zalo hands out server pools at RUNTIME, in `zpw_service_map_v3` from the login
  # response, and rotates between members on reconnect: ws1..ws12-msg for the realtime
  # socket, tt-chat/tt-group/tt-files/tt-profile-wpa for thread and media reads,
  # jr.zaloapp.com for session establishment.
  #
  # Enumerating that pool by hand is guesswork, and guessing wrong fails INTERMITTENTLY
  # - the listener runs until it rotates onto an undeclared host, then dies looking
  # like a provider fault. Measured over one evening: three separate outages, three
  # different pool members, each costing the owner a fresh QR scan to find.
  #
  # Both subtrees belong to Zalo, which is the only external party this channel talks
  # to, so the suffix form does not widen the trust boundary - it just stops pretending
  # a runtime-assigned pool can be written down in advance.
  - host: .zalo.me
    port: 443
    purpose: Zalo - identity, chat, realtime socket and thread transport
  - host: .zaloapp.com
    port: 443
    purpose: Zalo - login session establishment pool
  - host: .zdn.vn
    port: 443
    purpose: Zalo - avatar and attachment CDN

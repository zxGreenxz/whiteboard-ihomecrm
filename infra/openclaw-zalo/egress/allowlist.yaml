version: 1
destinations:
  - host: tryymsxyyckgbrmmvozx.supabase.co
    port: 443
    purpose: supabase control plane
  - host: openclaw-media.chillhome.io.vn
    port: 443
    purpose: private media gateway
  - host: ai.chillhome.io.vn
    port: 443
    purpose: independent model provider
  - host: chat.zalo.me
    port: 443
    purpose: Zalo chat transport
  - host: id.zalo.me
    port: 443
    purpose: Zalo identity transport
  - host: jr.chat.zalo.me
    port: 443
    purpose: Zalo realtime chat transport
  - host: wpa.chat.zalo.me
    port: 443
    purpose: Zalo websocket transport
  # Measured, not guessed. A full QR login was captured through an enumerating proxy:
  # `jr.zaloapp.com` is contacted between GotLoginInfo and checkSession, i.e. exactly
  # where the session is established. With it blocked, `checkSession` returns nothing
  # and zca-js throws "Cannot get session, login failed" - which surfaced to the owner
  # as "quét mã không hoạt động" after Zalo had already confirmed the login on their
  # phone. The broker's denial log omitted the host, so nothing anywhere named it.
  - host: jr.zaloapp.com
    port: 443
    purpose: Zalo login session establishment
  - host: tt-profile-wpa.chat.zalo.me
    port: 443
    purpose: Zalo profile transport
  # The inbound listener's WebSocket pool, from `zpw_ws` in the login response.
  #
  # The WHOLE pool is declared, not just the members seen so far. zca-js rotates
  # endpoints on close (`rotateEndpoint`), so listing only the observed ws1/ws4/ws12
  # buys a listener that works now and dies whenever it rotates onto an undeclared
  # one - an intermittent failure, which is the most expensive kind here.
  #
  # Wildcards are forbidden by construction in this allowlist, so a numbered pool has
  # to be enumerated. These were invisible until two fixes landed together: routing
  # provider sockets through the broker (`ws` ignores proxy env vars, so the listener
  # was failing DNS directly and dying in ~50ms as "[object Object]"), and making the
  # broker name the host it refuses.
  - host: ws1-msg.chat.zalo.me
    port: 443
    purpose: Zalo realtime websocket pool
  - host: ws2-msg.chat.zalo.me
    port: 443
    purpose: Zalo realtime websocket pool

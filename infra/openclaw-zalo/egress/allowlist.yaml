  # and zca-js throws "Cannot get session, login failed" - which surfaced to the owner
  # as "quét mã không hoạt động" after Zalo had already confirmed the login on their
  # phone. The broker's denial log omitted the host, so nothing anywhere named it.
  - host: jr.zaloapp.com
    port: 443
    purpose: Zalo login session establishment

# Include inside an existing HTTPS server block after inspecting the VPS configuration.
# The gateway owns only this path. No change to the 9router upstream.
location = /webhooks/sms {
    client_max_body_size 64k;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
    access_log off;
}

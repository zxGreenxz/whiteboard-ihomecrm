# ĐÃ ĐÓNG 07/08/2026 — baseline-not-verified-on-supabase.
#
# Đã diễn tập thật trên một Supabase project trắng (PostgreSQL 17.6, cùng bản
# chính với production) do chủ dự án cấp. Kết quả cuối: bảng 439/439 ·
# view 14/14 · policy 1193/1193 · trigger 493/493.
#
# NHƯNG lần chạy ĐẦU TIÊN thất bại, và đó mới là giá trị của việc diễn tập:
#   → policy chỉ dựng được 922/1193 (mất 271, tức mất phần lớn hàng rào RLS)
#   → 249 lỗi 'role "…" does not exist'
# Nguyên nhân: pg_dump --schema-only KHÔNG dump role (role thuộc cấp cluster),
# nên baseline tham chiếu 7 role riêng của ứng dụng mà không tạo chúng.
#
# Ghi chú CŨ của mục này nói lỗi khi restore lên Postgres trần "đều do target
# thiếu role của Supabase — trên project Supabase thật thì chúng có sẵn". Vế
# đầu đúng, SUY LUẬN SAU SAI: các role thiếu là role của CHÍNH ỨNG DỤNG
# (openclaw_function_owner, ie_canonical_writer…), Supabase không có sẵn. Chỉ
# diễn tập thật mới phân biệt được hai điều đó.
#
# Và manifest luôn ghi đủ số đếm (439 bảng, 1193 policy) vì nó đếm trên FILE,
# không đếm trên KẾT QUẢ khôi phục — nên trên giấy baseline lúc nào cũng đầy đủ.
#

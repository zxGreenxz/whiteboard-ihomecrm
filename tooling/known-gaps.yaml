# Sổ đăng ký các khoảng trống ĐÃ BIẾT và cố ý chưa gating.
#
# Vì sao cần: một bước `continue-on-error: true` hay một suite chỉ chạy được trên
# Windows là quyết định hợp lý tại thời điểm đó — nhưng không có ngày hết hạn thì
# nó thành vĩnh viễn, và sau vài tháng không ai còn nhớ nó là quyết định hay là
# thứ bị bỏ quên. Mỗi mục dưới đây phải có ngày hết hạn; quá hạn thì
# scripts/check-known-gaps.mjs kêu, và cách xử là ĐÓNG nó hoặc GIA HẠN CÓ LÝ DO,
# không phải xoá dòng cho yên.
#
# Cố ý giữ schema tối thiểu: id / expires_at / why / exit_condition. Bỏ `owner`
# (repo một người) và `evidence` (optional) — thêm field chỉ làm người ta lười
# cập nhật.
#
# Kiểm: npm run gate:known-gaps

schemaVersion: 1
gaps:
  - id: supabase-cli-replay-broken
    where: .github/workflows/network-center-validation.yml (bước "Measure the historical Supabase replay")
    expires_at: 2026-11-30
    why: >
      Replay 640 file migration qua Supabase CLI từ database trắng KHÔNG thể thành công
      và chưa bao giờ thành công — bốn nguyên nhân độc lập ghi ở đầu
      scripts/network-center-disposable-db.mjs. Bước này giữ lại như phép ĐO
      (continue-on-error) chứ không phải gate; nửa gating là --local-cluster.
    exit_condition: >
      Đợt 3 dựng xong production baseline + forward-only lane. Khi đó môi trường mới
      dựng từ baseline chứ không replay lịch sử, và bước đo này hết lý do tồn tại.

  - id: cross-tenant-fixture-non-gating
    where: .github/workflows/network-center-validation.yml (nhánh `cross-tenant` của bước matrix)
    expires_at: 2026-11-30
    why: >
      Ma trận 20 ca xuyên-tenant dựng payload inventory dạng legacy-v1 mà đường tương thích
      hiện tại từ chối trên database vừa dựng mới. Bản thân schema ĐÚNG — mọi migration
      Network Center đều apply — nên cái thiếu là DỮ LIỆU FIXTURE, không phải tính chất bảo
      mật. Vì vậy bước này nuốt lỗi bằng `|| { echo "::warning::" }` và vẫn chạy để ghi nhận
      thay vì giấu đi.
      Quyết định này đã được giải thích trong comment ngay tại chỗ từ trước, nhưng CHƯA có
      trong sổ này — tức không có ngày hết hạn. Đúng thứ mà chính file này nói là cách biến
      một quyết định có thời hạn thành khoảng trống vĩnh viễn. Đăng ký 06/08/2026.
    exit_condition: >
      Dựng fixture inventory đúng định dạng hiện hành cho 20 ca, rồi bỏ `|| { echo ... }` để
      bước này gating thật.

  - id: required-checks-khong-cuong-che-duoc
    where: GitHub repository settings (branch protection cho `main` và `production`)
    expires_at: 2027-02-06
    why: >
      Repo private trên GitHub Free KHÔNG có branch protection, nên không thể đặt gate nào
      thành "required check". Nghĩa là mọi cửa chặn của repo này đều kêu SAU KHI push, không
      chặn được lúc push. Đây là giới hạn của gói dịch vụ, không phải thiếu sót thiết kế.

      BIỆN PHÁP THAY THẾ ĐANG CHẠY (11/08/2026), và nó có thật chứ không phải lời hứa:
      (1) job `production-promotion` chạy trên MỌI push vào nhánh `production`;
      (2) `scripts/check-production-promotion.mjs` — commit chỉ tồn tại trên production
          (chưa từng qua CI của main) làm job đỏ;
      (3) `scripts/promote-to-production.mjs` — đọc kết luận CI ở mức BƯỚC, nên một bước
          fail bị `continue-on-error` nuốt (job vẫn success, trang Checks vẫn xanh) vẫn bị
          chặn; thiếu token thì exit 3 chứ không phải xanh.
      Kêu sau vẫn hơn không biết: nó biến một sự kiện vô hình thành một dòng đỏ có người đọc.

      CHƯA TỰ XÁC MINH ĐƯỢC: `check-external-controls.mjs` báo branchProtection
      `status: unverified` vì máy chạy không có GH_TOKEN. Tức khẳng định "Free không có
      branch protection" hiện dựa trên một lần đo trước đó, chưa có bằng chứng chạy lại.
    exit_condition: >
      Nâng gói (Team/Pro) hoặc chuyển repo sang public ⇒ bật branch protection với required
      checks cho main và production, rồi chạy `check-external-controls.mjs` KÈM GH_TOKEN để
      `githubBranchProtection` chuyển từ `unverified` sang `verified`. Đóng mục này khi
      bằng chứng đó tồn tại — KHÔNG đóng chỉ vì đã có biện pháp thay thế.

  - id: pitr-disabled-accepted-risk
    where: Supabase project tryymsxyyckgbrmmvozx
    expires_at: 2027-02-06
    why: >
      PITR TẮT và đây là lựa chọn có chủ đích (06/08/2026): add-on tính phí riêng, chủ dự án
      chọn phương án miễn phí. Chỉ có backup vật lý hằng ngày ⇒ RPO tối đa ~24 giờ trên dữ
      liệu tiền thật. Giảm nhẹ: scripts/backup-before-schema.mjs bắt buộc chạy trước mọi
      thao tác schema (đã diễn tập restore thật 06/08).
      PHẦN CHƯA ĐƯỢC CHE: sự cố đến từ code chạy hằng ngày — dump thủ công không giúp gì,
      đường lùi vẫn là 24 giờ. Đây là rủi ro ĐƯỢC CHẤP NHẬN, không phải đã giải quyết.
    exit_condition: >
      Bật PITR khi quy mô tiền/rủi ro đủ lớn để 100 USD/tháng là rẻ; hoặc rà lại sau 6 tháng
      xem RPO 24 giờ còn chấp nhận được không.

  - id: ci-gates-mot-job-thay-vi-ba
    where: .github/workflows/ci-gates.yml (job `quality-gates`)
    expires_at: 2026-12-31
    why: >
      Plan §31 đặt tên ba job `contract-gates` / `schema-gates` / `docs-freshness`. Repo có ba
      STEP mang đúng tên đó nhưng nằm trong MỘT job. Đây là lựa chọn có chủ ý, không phải bỏ sót.
      Plan §0.6 vốn muốn gộp 8 job thành 3 để "giảm bề mặt bảo trì và số nơi có thể kẹt merge";
      gộp về một job đi cùng hướng đó, chỉ xa hơn.
      Phần giá trị DUY NHẤT còn thiếu là tên JOB, và tên job chỉ dùng được khi bật required check
      — điều bất khả ở tier hiện tại: repo private trên GitHub Free, đã đo và ghi ở
      docs/generated/external-controls.json (branch protection không enforce được).
      Chia thành ba step CÓ TÊN lấy lại phần giá trị thực tế: giao diện PR chỉ ra ngay NHÓM nào
      đỏ thay vì một khối 19 lệnh phải mở log mới biết. Ba runner khởi động thì không lấy lại gì.
      Đăng ký 07/08/2026 để deliverable này không treo lơ lửng giữa "đã làm" và "chưa làm".
    exit_condition: >
      Repo chuyển sang tier bật được branch protection (GitHub Team/Pro, hoặc public). Khi đó tách
      ba step thành ba job và đặt chúng làm required check — lúc ấy tên job mới có tác dụng.

  - id: ua-graph-stale
    where: .ua/ (knowledge-graph.json, fingerprints.json, meta.json) — baseCommit ca31186e, 07/08/2026
    expires_at: 2026-09-30
    why: >
      CẬP NHẬT 08/08/2026 — hai trong ba điều kiện đóng ĐÃ ĐẠT, con số cũ trong mục này đã
      sai hoàn toàn nên viết lại. Giữ số cũ ở đây thì chính sổ này thành thứ nó sinh ra để
      chặn: một cảnh báo không còn đúng thì không ai đọc nữa.

      ĐÃ LÀM (commit a58460af + b654ed9d, merge vào main qua PR riêng theo luật #6):
      dựng lại TOÀN BỘ graph tại ca31186e — 3.042/3.042 file có node, 7.800 node,
      17.919 cạnh, 5.976/5.976 cạnh imports khớp importMap tất định, 0 node trùng,
      0 cạnh treo, 0 issue từ validator. Network Center và OpenClaw hết mù: 88 và 364 node,
      trước là 0 và 0. Manifest đổi toolVersionSource "attested" → "measured" (đọc thẳng
      package.json của plugin đã chạy), tức khoản nợ "CHƯA ĐƯỢC CHE" của bản ghi cũ đã trả.

      SỐ ĐO HIỆN TẠI (đo 08/08/2026, thay cho "488 commit / 18 subsystem" đã lỗi thời):
      cũ 25 commit · 1 tiểu hệ vắng mặt — `services/openclaw-media-gateway`. Dịch vụ này
      RA ĐỜI SAU lần refresh, nên đây là trôi bình thường của một repo đang phát triển,
      KHÔNG phải khoảng trống thiết kế như 18 tiểu hệ trước đây.

      VÌ SAO GAP CHƯA ĐÓNG: policy đặt maxMissingSubsystems = 0, nên đúng một tiểu hệ vắng
      cũng đủ làm `--nhiem-vu architecture` exit 1. Ngưỡng 0 là CỐ Ý và không nên nới:
      một hệ con vắng mặt hoàn toàn là loại mù nguy hiểm nhất — graph không báo rằng nó mù.
    exit_condition: >
      `npm run gate:graph-freshness -- --nhiem-vu architecture` exit 0. Hai điều kiện kia
      (refresh trong PR riêng theo luật #6; manifest ghi toolVersion đo THẬT thay vì
      attested) đã đạt 08/08/2026 — xem tooling/graph-manifests/ua.json.
      Thực tế: cần một lần refresh nữa sau khi services/openclaw-media-gateway ổn định.
      ĐỪNG refresh sau mỗi service mới — mỗi lần là một PR riêng 8 MB; gom lại theo đợt.

  - id: contract-type-handwritten-drift
    where: src/hooks/useContracts.ts (2 chỗ `as unknown as ContractWithRelations`)
    expires_at: 2026-11-30
    why: >
      ContractWithRelations là kiểu VIẾT TAY, không khớp hình dạng thật DB trả: một số cột
      nullable ở DB được khai không-null, và quan hệ lồng biểu diễn khác. Ratchet any-cast đã
      về 0 (07/08/2026) và hai chỗ còn lại là khẳng định HẸP, khác hẳn `(supabase as any)` cũ:
      chuỗi select nay là hằng LITERAL nên tên bảng/cột được kiểm kiểu thật, chỉ hình dạng
      cuối cùng là lời khai. Phần chưa che: nếu DB đổi một cột thành nullable, hai chỗ này
      không đỏ.
    exit_condition: >
      Hoà giải ContractWithRelations với kiểu sinh từ types.ts — hoặc bỏ hẳn kiểu viết tay và
      dùng kiểu suy ra từ select. Là một lượt riêng vì đụng nhiều consumer của kiểu đó.


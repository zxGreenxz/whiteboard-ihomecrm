# Khoảng trống đang mở: lý do, hạn rà lại và điều kiện đóng.
# Kiểm định kỳ bằng node scripts/check-known-gaps.mjs --strict; lịch sử mục đã đóng ở Git.

schemaVersion: 1
gaps:
  - id: required-checks-khong-cuong-che-duoc
    loai: chap-nhan-vinh-vien
    where: GitHub repository settings (branch protection cho `main` và `production`)
    expires_at: 2027-02-06
    why: >
      Repo private trên GitHub Free KHÔNG có branch protection, nên không thể đặt gate nào
      thành "required check". Nghĩa là mọi cửa chặn của repo này đều kêu SAU KHI push, không
      chặn được lúc push. Đây là giới hạn của gói dịch vụ, không phải thiếu sót thiết kế.

      BIỆN PHÁP THAY THẾ ĐANG CHẠY (11/08/2026), và nó có thật chứ không phải lời hứa:
      (1) job `production-promotion` chạy trên MỌI push vào nhánh `production`;
      (2) `scripts/check-production-promotion.mjs` — commit chỉ tồn tại trên production
          (chưa từng qua CI của main) làm job đỏ;
      (3) `scripts/promote-to-production.mjs` — đọc kết luận CI ở mức BƯỚC. Đo 15/09/2026:
          repo hiện KHÔNG còn `continue-on-error` nào, nên đây không phải mô tả hiện trạng
          mà là lớp phòng thân — nếu sau này có ai thêm một cái, job vẫn success và trang
          Checks vẫn xanh, nhưng promote vẫn bị chặn; thiếu token thì exit 3 chứ không phải xanh.
      Kêu sau vẫn hơn không biết: nó biến một sự kiện vô hình thành một dòng đỏ có người đọc.

      Script kiểm control đọc metadata nhánh để xác minh absence khi protection API bị 403.
      Xác minh không có protection không thay thế việc cưỡng chế required checks.
    exit_condition: >
      Nâng gói (Team/Pro) hoặc chuyển repo sang public ⇒ bật branch protection với required
      checks cho main và production, rồi chạy `check-external-controls.mjs` KÈM GH_TOKEN để
      `githubBranchProtection` chuyển sang `present`. Đóng mục này khi
      bằng chứng đó tồn tại — KHÔNG đóng chỉ vì đã có biện pháp thay thế.

  - id: management-api-ghi-khong-cua
    where: >
      scripts/apply-accounting-rollout.mjs · scripts/backfill-deposit-vouchers.mjs ·
      scripts/seed-zalo-demo.mjs
    expires_at: 2026-11-30
    why: >
      Ba script này GHI được vào production qua Management API mà không đi qua cửa nào:
      không promotion token, không lane forward, không giới hạn org. Đo 11/08/2026 khi
      thêm trường `giayPhep` vào tooling/management-api-writers.json — trước đó trường
      `why` là văn xuôi nên không ai đối chiếu được, và ba script này lẫn giữa 17 mục
      `write` cùng với 6 mục thật ra CHỈ ĐỌC (bị xếp nhầm vì SQL của chúng trích văn bản
      định nghĩa hàm có chữ CREATE).

      Mức rủi ro của ba cái KHÔNG bằng nhau:
      - apply-accounting-rollout: đổi schema, có advisory lock + digest riêng. Nguy hiểm
        nhất, và cũng là thứ lane forward chưa mô hình hoá được (rollout có thứ tự riêng).
      - backfill-deposit-vouchers: DML một lần, có dry-run, chạy tay.
      - seed-zalo-demo: xoá/chèn theo nhãn `meta.seed='zalo-demo'` và theo owner email.
        Khoanh vùng bằng nhãn, KHÔNG bằng org — nên nhập sai SEED_OWNER_EMAIL là chạm dữ
        liệu người khác.

      Chưa gắn promotion token ngay vì cả ba đều chạy tay và việc thêm một cửa chỉ có giá
      trị khi cửa đó không bị người chạy bỏ qua — cần đo cách dùng thật trước.
    exit_condition: >
      Mỗi script hoặc (a) đòi IHOMECRM_PROMOTION_TOKEN như apply-sql.mjs, hoặc (b) tự giới
      hạn vào org DEMO/TEST và khai lại `giayPhep` tương ứng, hoặc (c) bị xoá nếu đã hết
      việc. Đóng khi `giayPhep: khong-co-cua` không còn mục nào — gate
      check-management-api-writes tự đòi khoảng trống này khi còn.

  - id: baseline-schema-khong-trong-repo
    where: supabase/baseline/ · chưa có bản ghi restore vào Supabase project THẬT
    expires_at: 2026-11-30
    why: >
      CẬP NHẬT 13/08/2026 — nửa đầu của gap này ĐÃ ĐÓNG: schema.sql (5.6MB, sha256 ghim
      trong manifest) đã COMMIT vào repo, vì workflow Migration Restore Drill chạy trên
      checkout sạch của CI cần đúng file đó và đã đỏ 7/7 lần chạy kể từ khi ra đời vì
      thiếu nó. Fresh clone giờ tự diễn tập được; drill chạy trọn 3 bước trong CI
      (restore 439/439 bảng · forward lane 0 lệch sổ kỳ vọng · kiểm bảo mật sạch — đo
      local Docker postgres:17.6 trước khi push).

      Phần CÒN LẠI của gap: mọi diễn tập tới nay đều trên PostgreSQL TRẦN + platform-shim
      (giả lập role/default privileges của Supabase). CHƯA lần nào restore vào một Supabase
      project thật — auth/storage/realtime schema thật có thể hành xử khác shim, và đó là
      môi trường duy nhất giống hoàn cảnh khôi phục thật.
    exit_condition: >
      Restore baseline vào một Supabase project THẬT, ghi kết quả vào manifest.restoreDrill
      (bảng/hàm/policy khớp counts), rồi hoặc (a) dựng job migration-forward-gates với
      credential trong secret, hoặc (b) ghi rõ ở đây rằng CI công khai cố ý không có đường đó
      và diễn tập chạy tay theo lịch. Đóng khi có bản ghi restore thành công trên Supabase.


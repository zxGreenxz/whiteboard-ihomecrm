# Sổ đăng ký các khoảng trống ĐÃ BIẾT và cố ý chưa gating.
#
# Vì sao cần: một bước `continue-on-error: true` hay một suite chỉ chạy được trên
# Windows là quyết định hợp lý tại thời điểm đó — nhưng không có ngày hết hạn thì
# nó thành vĩnh viễn, và sau vài tháng không ai còn nhớ nó là quyết định hay là
# thứ bị bỏ quên. Mỗi mục dưới đây phải có ngày hết hạn; quá hạn thì
# scripts/check-known-gaps.mjs kêu, và cách xử là ĐÓNG nó hoặc GIA HẠN CÓ LÝ DO,
# không phải xoá dòng cho yên.
#
# Cố ý giữ schema tối thiểu: id / expires_at / why / exit_condition. Bỏ `owner`
# (repo một người) và `evidence` (optional) — thêm field chỉ làm người ta lười
# cập nhật.
#
# Kiểm: npm run gate:known-gaps

schemaVersion: 1
gaps:
  - id: supabase-cli-replay-broken
    where: .github/workflows/network-center-validation.yml (bước "Measure the historical Supabase replay")
    expires_at: 2026-11-30
    why: >
      Replay 640 file migration qua Supabase CLI từ database trắng KHÔNG thể thành công
      và chưa bao giờ thành công — bốn nguyên nhân độc lập ghi ở đầu
      scripts/network-center-disposable-db.mjs. Bước này giữ lại như phép ĐO
      (continue-on-error) chứ không phải gate; nửa gating là --local-cluster.
    exit_condition: >
      Đợt 3 dựng xong production baseline + forward-only lane. Khi đó môi trường mới
      dựng từ baseline chứ không replay lịch sử, và bước đo này hết lý do tồn tại.

  - id: deployment-assets-windows-only
    where: infra/network-center-worker/test/deploymentAssets.test.ts
    expires_at: 2026-10-31
    why: >
      Ba test shell ra powershell.exe vô điều kiện nên FAIL trên runner Linux. Đây là
      tín hiệu có chủ đích: suite deployment-asset chỉ kiểm được trên Windows, tức là
      không kiểm được trên chính nền tảng mà release chạy. Che nó đi bằng skip sẽ biến
      một khoảng trống nhìn thấy được thành khoảng trống vô hình.
    exit_condition: >
      Port sang cross-platform, hoặc tách job Windows riêng trong CI để nó thực sự chạy.

  - id: pitr-disabled-accepted-risk
    where: Supabase project tryymsxyyckgbrmmvozx
    expires_at: 2027-02-06
    why: >
      PITR TẮT và đây là lựa chọn có chủ đích (06/08/2026): add-on tính phí riêng, chủ dự án
      chọn phương án miễn phí. Chỉ có backup vật lý hằng ngày ⇒ RPO tối đa ~24 giờ trên dữ
      liệu tiền thật. Giảm nhẹ: scripts/backup-before-schema.mjs bắt buộc chạy trước mọi
      thao tác schema (đã diễn tập restore thật 06/08).
      PHẦN CHƯA ĐƯỢC CHE: sự cố đến từ code chạy hằng ngày — dump thủ công không giúp gì,
      đường lùi vẫn là 24 giờ. Đây là rủi ro ĐƯỢC CHẤP NHẬN, không phải đã giải quyết.
    exit_condition: >
      Bật PITR khi quy mô tiền/rủi ro đủ lớn để 100 USD/tháng là rẻ; hoặc rà lại sau 6 tháng
      xem RPO 24 giờ còn chấp nhận được không.

  - id: claude-agents-md-still-full
    where: CLAUDE.md (211 dòng), AGENTS.md (146 dòng)
    expires_at: 2026-11-30
    why: >
      AI_RULES.md ĐÃ rút thành pointer (06/08). Hai file còn lại vẫn giữ nội dung đầy đủ vì
      chúng chứa phần đặc thù từng agent (cách gọi tool, trailer commit, quy trình E2E) xen
      lẫn phần trùng Contract — tách cần đọc từng mục, không cắt máy móc được.
      Rủi ro hiện tại THẤP: gate check-agent-contract nay bảo vệ 16 invariant và đã chứng
      minh bắt được khi một cái biến mất khỏi Contract.
    exit_condition: >
      Rút CLAUDE.md/AGENTS.md còn phần đặc thù agent + pointer; gate vẫn xanh sau khi rút.



  - id: baseline-not-verified-on-supabase
    where: supabase/baseline/ (manifest.json + schema.sql)
    expires_at: 2026-10-31
    why: >
      Baseline đã sạch partition runtime (0 rò rỉ) và restore được trên PostgreSQL 17.10
      trần: 303 bảng, 948 hàm, 803 policy. 817 lỗi còn lại đều do target thiếu schema auth
      và các role của Supabase — trên project Supabase thật thì chúng có sẵn. Nhưng CHƯA
      restore thử trên một Supabase project thật nên chưa gọi là verified.
    exit_condition: >
      Tạo một Supabase project tạm, restore baseline vào đó, xác nhận số bảng/hàm/policy khớp
      production, rồi đổi manifest.status thành verified.

  - id: buildingfilterselect-test-failing
    where: src/components/buildings/__tests__/BuildingFilterSelect.test.tsx
    expires_at: 2026-09-30
    why: >
      2 test đỏ SẴN từ trước đợt rà soát (xác minh bằng cách stash mọi thay đổi rồi chạy
      lại — vẫn đỏ y hệt). Không nằm trong phạm vi các đợt đang làm nên chưa xử, nhưng
      nó khiến job quality-gates không bao giờ xanh hoàn toàn.
    exit_condition: Sửa hoặc gỡ 2 test đó; vitest chạy file này xanh.

  - id: contract-type-handwritten-drift
    where: src/hooks/useContracts.ts (2 chỗ `as unknown as ContractWithRelations`)
    expires_at: 2026-11-30
    why: >
      ContractWithRelations là kiểu VIẾT TAY, không khớp hình dạng thật DB trả: một số cột
      nullable ở DB được khai không-null, và quan hệ lồng biểu diễn khác. Ratchet any-cast đã
      về 0 (07/08/2026) và hai chỗ còn lại là khẳng định HẸP, khác hẳn `(supabase as any)` cũ:
      chuỗi select nay là hằng LITERAL nên tên bảng/cột được kiểm kiểu thật, chỉ hình dạng
      cuối cùng là lời khai. Phần chưa che: nếu DB đổi một cột thành nullable, hai chỗ này
      không đỏ.
    exit_condition: >
      Hoà giải ContractWithRelations với kiểu sinh từ types.ts — hoặc bỏ hẳn kiểu viết tay và
      dùng kiểu suy ra từ select. Là một lượt riêng vì đụng nhiều consumer của kiểu đó.

  - id: copilot-plan-reconcile-unknown-effect
    where: supabase/migrations/20260903100253_copilot_execution_plan_v1.sql (public.copilot_plan_reconcile_step_v1)
    expires_at: 2027-01-31
    why: >
      Máy kế hoạch thực thi (G3) khai `UNKNOWN_EFFECT` là một trạng thái bước hợp lệ, và khai
      luôn RPC đối soát cho nó — nhưng `copilot_plan_reconcile_step_v1` hiện chỉ
      `RAISE not_implemented` (0A000). Chữ ký + ACL có từ 03/09/2026 vì thứ đắt nhất khi thêm
      một RPC không phải thân hàm mà là chữ ký đi vào types.ts, lớp gọi RPC và test.

      Vì sao đây là quyết định chứ không phải thiếu sót: ở Mức 2 KHÔNG action nào có hiệu ứng
      NGOÀI database. Cả 7 hàng `copilot_action_registry` đều ghi qua Postgres trong một giao
      dịch, nên một lần timeout luôn kết luận được (giao dịch hoặc commit hoặc rollback) và
      không bước nào rơi vào `UNKNOWN_EFFECT`. Trạng thái đó chỉ có nghĩa khi Mức 3 mở các
      action gửi Zalo hoặc đẩy lệnh xuống router — lúc đó một timeout THẬT SỰ không cho biết
      việc đã xảy ra hay chưa, và phải đọc lại nguồn ngoài mới chốt được.

      Rủi ro trong lúc chờ: một client đọc chữ ký này rồi tưởng đã có đường đối soát. RPC trả
      `not_implemented` tường minh (chứ không trả kết quả rỗng) chính là để chặn hiểu nhầm đó
      — im lặng trả `{}` mới là cái bẫy. `.e2e-fleet/specs/copilot-plan-batch-consent.spec.ts`
      KHÔNG có ca nào cho RPC này, vì chưa có gì để đo.
    exit_condition: >
      G5-C viết thân `copilot_plan_reconcile_step_v1` (đọc lại nguồn ngoài, chốt bước thành
      DONE hoặc FAILED, ghi sổ) CÙNG với action Mức 3 đầu tiên có hiệu ứng ngoài database, và
      thêm ca E2E dựng đúng cảnh timeout-rồi-đối-soát vào
      .e2e-fleet/specs/copilot-plan-batch-consent.spec.ts. Không có action ngoài-DB thì không
      đóng bằng cách viết thân suông — gia hạn kèm lý do.

  - id: e2e-copilot-khong-co-trace
    where: .github/workflows/copilot-e2e.yml (bước chạy 3 spec · bước dọn · bước guard · upload-artifact)
    expires_at: 2026-12-31
    why: >
      Suite E2E Copilot trên CI chạy `--reporter=list --trace=off` và KHÔNG sinh HTML report;
      artifact tải lên chỉ là stdout của reporter list. Mất trace VÀ mất cả report HTML, tức
      khi một ca đỏ ta chỉ có tên ca + thông báo lỗi, không xem lại được từng bước.

      Đó là cố ý, và lý do mạnh hơn "trace nặng". Đo 02/09/2026 (Playwright 1.61.1, đã đặt
      `trace: 'off'` và `screenshot: 'off'`) trên một spec vứt đi có `fill()` ô mật khẩu:
        (1) mỗi test ĐỎ sinh attachment `playwright-report/data/<hash>.md` (error-context.md)
            chứa ARIA snapshot của trang, trong đó giá trị ô `type="password"` nằm NGUYÊN VĂN;
        (2) nặng hơn: `index.html` NHÚNG report JSON dưới dạng `data:application/zip;base64,`
            (deflate), và trong đó có tiêu đề bước `"title":"Fill \"<giá trị>\" locator(...)"`.
            Nghĩa là mật khẩu có mặt ở MỌI lượt chạy gọi `fill()`, kể cả lượt XANH — và vì đã
            nén nên `grep` bản rõ trên thư mục report luôn báo SẠCH.
      Nói cách khác: xoá attachment là CẦN nhưng KHÔNG ĐỦ, và một guard chỉ dựa vào grep sẽ
      gật đầu rồi tải mật khẩu DEMO lên một artifact sống 14 ngày mà ai đọc được repo cũng
      tải được. Bản ghi trước (cùng ngày) khẳng định "HTML report không chứa giá trị đã điền"
      — điều đó SAI, đây là đính chính.

      ĐANG GIẢM THIỂU: không sinh HTML report; bước dọn xoá mọi attachment không phải ảnh rồi
      xoá hẳn report + test-results; bước guard grep từng mật khẩu VÀ từ chối mọi file có
      chuỗi `data:application/zip;base64,` (thứ grep không kiểm được thì không được tải lên);
      upload chỉ chạy khi guard xanh. Đã đóng cả đường rò cục bộ: `playwright-report/` ở GỐC
      repo (nơi Playwright thật sự ghi, vì `.e2e-fleet/` không có package.json) nay nằm trong
      .gitignore.

      ÁP DỤNG CHO MỌI SPEC CỦA FLEET, không riêng 3 spec Copilot: cứ spec nào đăng nhập bằng
      `.fill(mật_khẩu)` thì report của nó mang mật khẩu. Workflow nào sau này tải
      `playwright-report/` lên PHẢI dùng lại đúng cặp bước dọn + guard này.
    exit_condition: >
      Đổi cách đăng nhập sang `storageState`: dựng phiên MỘT lần trong global setup (ngoài mọi
      vùng ghi hình/ghi bước, không spec nào thấy mật khẩu), các spec chỉ nạp lại state. Khi
      mật khẩu không còn đi qua `fill()` của bất kỳ spec nào, bật lại `--reporter=list,html` +
      `--trace=retain-on-failure` và tải lên `playwright-report/`, giữ nguyên guard làm lưới
      an toàn, rồi xoá mục này.

  - id: copilot-approval-badge-system-source-not-exposed
    where: src/components/approvals/AiSubmittedBadge.tsx · src/hooks/useApprovals.ts (PendingApproval.system_source) · public.list_my_pending_approvals_v1
    expires_at: 2026-12-31
    why: >
      Task G4 (03/09/2026) yêu cầu badge "Do AI nộp" trên hộp chờ duyệt khi
      `approval_requests.system_source = 'AI_COPILOT'` (giá trị do
      `app_private.copilot_plan_submit_voucher_v1` ghi qua `submit_financial_voucher`,
      migration `20260903100253_copilot_execution_plan_v1.sql`). Component ĐÃ VIẾT
      XONG và có test render (renderToStaticMarkup) khoá đúng hành vi — nhưng
      `public.list_my_pending_approvals_v1()` (RPC mà `usePendingApprovals()` gọi,
      định nghĩa ở `20260723250000_finance_v2_inbox_org.sql`) KHÔNG chiếu cột
      `system_source` ra `RETURNS TABLE`, nên field này luôn `null` trên production
      và badge không bao giờ sáng. Nới thêm MỘT cột vào RETURNS TABLE là một
      migration — ngoài phạm vi task G4 (ràng buộc "không sửa RPC/không migration").
      Cũng vì cùng lý do (idempotency key `copilot_plan:<plan>:<step>` được truyền
      vào `submit_financial_voucher` nhưng KHÔNG được lưu — xem chú thích trong
      chính migration trên), `plan_id` không truy ngược được từ hồ sơ duyệt, nên
      prop `planId` của badge luôn `undefined` hôm nay — tooltip chỉ nói "AI nộp
      hộ", không link được tới kế hoạch.
    exit_condition: >
      Một migration DROP/CREATE `list_my_pending_approvals_v1` thêm cột
      `system_source` (và nếu muốn cả link-tới-plan: lưu `plan_id`/`step_no` vào
      một cột mới trên `approval_requests` tại lúc `copilot_plan_submit_voucher_v1`
      gọi `submit_financial_voucher`, vì RPC gốc không dùng `p_idempotency_key`).
      Sau đó `PendingApproval.system_source`/`planId` tự có giá trị thật, badge tự
      sáng — không cần đổi gì thêm ở FE.

  - id: copilot-golden-eval-real-lane-daily-quota
    where: docs/generated/copilot-golden-eval/939fb75d59e5a1e6414b799e5ac9911f34e44f10.json · scripts/generate-copilot-golden-real-results.mjs
    expires_at: 2026-10-15
    why: >
      Task G4 (03/09/2026) chạy lane real-model của bộ 71 ca vàng bằng
      `openrouter:nvidia/nemotron-3-super-120b-a12b:free` qua `llm-proxy` sản xuất,
      dùng JWT super admin trên org DEMO. Chỉ đo được 17/71 ca (15 pass, 2 fail —
      cả hai là mập mờ ranh giới tool/prompt, không phải model kém, xem
      `docs/he-thong/21-ai-copilot.md` § "Mức 2 đã vận hành") trước khi chạm hạn
      mức token/ngày của tổ chức DEMO (`daily_token_quota` — HTTP 403, đúng cơ chế
      quản trị Mức 2 đang hoạt động, không phải lỗi harness): system prompt +
      37–46 tool schema production nặng hơn nhiều so với ngân sách ngày dành cho
      một org canary. 54 ca còn lại ghi `status: 'blocked'` trong artifact (không
      bịa `toolPath` rỗng — dùng đúng `expected.toolPath` làm giá trị trung tính
      để không tự tạo ra một "toolPath mismatch" giả cho ca chưa từng hỏi được
      model), nên `verdict` tổng của artifact là `blocked`, trung thực với hiện
      trạng. Latency SLA (p50/p95) cũng chỉ đo được trên mẫu n=17 thay vì 20 câu
      brief đề nghị, cùng lý do.
    exit_condition: >
      Chạy lại `node scripts/generate-copilot-golden-real-results.mjs` sau khi hạn
      mức ngày của DEMO reset (kiểm bằng một lượt gọi `chat/completions` nhỏ trước
      khi chạy hết 71 ca), rồi `node scripts/run-copilot-golden-eval.mjs --lane
      real-model ...` ghi đè artifact với `verdict: 'pass'`/`'blocked'` dựa trên đủ
      71 ca đo thật. Nếu hạn mức ngày của DEMO là quá nhỏ cho một lượt eval đầy đủ,
      cân nhắc nâng riêng hạn mức đó cho org DEMO (quyết định chủ dự án, không tự
      ý đổi governance cap).


      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        run: node scripts/ci-run-gates.mjs --job vitest-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-vitest-tests-attempt-${{ github.run_attempt }}

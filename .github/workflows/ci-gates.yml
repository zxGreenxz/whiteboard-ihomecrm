  # ─────────────────────────────────────────────────────────────────────────
  # Đảo strict — vùng đã sạch không được bẩn lại (job riêng, chạy song song)
  #
  # Tách ra khỏi quality-gates ngày 25/08/2026 vì lý do thời gian, KHÔNG phải vì hạ chuẩn:
  # bước này vẫn đỏ y như cũ khi vi phạm, chỉ là nó chạy SONG SONG thay vì nối đuôi.
  # Đo trên run 32868528271: quality-gates 8m40s, trong đó đảo strict 2m38s + múi giờ
  # 2m06s = 4m44s, tức quá nửa. Hai bước đó không phụ thuộc gì vào các bước còn lại.
  # Chi phí thêm: ~25 giây dựng runner cho mỗi job — đổi lấy ~4 phút wall-clock.
  # ─────────────────────────────────────────────────────────────────────────
  strict-islands-gate:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (npm ci — khớp package-lock.json)
        run: npm ci

      # Tách khỏi "Contract gates" vì bước này gọi tsc HAI lượt (--showConfig +
      # biên dịch 247 file), tốn hàng chục giây — trong khi cả khối trên chạy dưới
      # một giây. Gộp vào sẽ làm mất tín hiệu "khối gate tĩnh nhanh".
      - name: Đảo strict — vùng đã sạch không được bẩn lại
        run: node scripts/check-strict-islands.mjs

      # Chặn NỢ MỚI — khác gate trên, vốn canh nợ CŨ không bẩn lại.
      # Cần lịch sử git (diff với merge-base), nên job này phải checkout fetch-depth: 0.

  # ─────────────────────────────────────────────────────────────────────────
  # Ổn định múi giờ (job riêng, chạy song song)
  #
  # Tách ra khỏi quality-gates ngày 25/08/2026 vì lý do thời gian, KHÔNG phải vì hạ chuẩn:
  # bước này vẫn đỏ y như cũ khi vi phạm, chỉ là nó chạy SONG SONG thay vì nối đuôi.
  # Đo trên run 32868528271: quality-gates 8m40s, trong đó đảo strict 2m38s + múi giờ
  # 2m06s = 4m44s, tức quá nửa. Hai bước đó không phụ thuộc gì vào các bước còn lại.
  # Chi phí thêm: ~25 giây dựng runner cho mỗi job — đổi lấy ~4 phút wall-clock.
  # ─────────────────────────────────────────────────────────────────────────
  timezone-gate:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (npm ci — khớp package-lock.json)
        run: npm ci

      # Runner này chạy UTC còn dữ liệu và người dùng ở UTC+7, nên một lỗi ngày
      # tháng có thể XANH ở đây và SAI trên máy người dùng — hoặc ngược lại. Bước
      # này chạy lại nhóm src/lib + src/hooks dưới 4 múi giờ (UTC-11 → UTC+14) và
      # đòi kết quả GIỐNG HỆT.
      # Nó đã chứng minh giá trị ngay lần chạy đầu: bắt được useOccupancyTrend12m
      # đưa chuỗi chỉ-có-ngày qua `new Date()` rồi đọc bằng getMonth() — biểu đồ
      # lấp đầy lệch một tháng ở mọi múi giờ âm. Cả 2810 test đều xanh ở UTC lẫn
      # UTC+7 nên không cách nào thấy nếu không thử ở múi giờ âm.
      # ~48 giây (4 lượt × 12s) nên KHÔNG gộp vào bước "Contract gates" vốn dành
      # cho các kiểm tra dưới một giây.
      - name: Ổn định múi giờ (chạy lại test ngày/tiền ở UTC-11 → UTC+14)
        run: npm run gate:timezone

  generated-types-local-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # fetch-depth 0 để bước dưới diff được với origin/main — checkout nông
          # chỉ có commit đỉnh thì `git diff` không có mốc so.
          fetch-depth: 0

      # ─── CHỈ CHẠY KHI SCHEMA/GENERATOR ĐỔI (thêm 26/08/2026) ───────────────
      # Job này replay TOÀN BỘ migration qua PGlite rồi gen types — bước đắt
      # nhất ngoài quality-gates, và trước đây chạy trên MỌI PR/push kể cả khi
      # diff chỉ đụng UI. Câu nó trả lời ("replay migration có dựng lại đúng
      # schema production không") chỉ đổi đáp án khi một trong các đường dưới
      # đây đổi — diff không chạm thì kết luận của lần chạy trước vẫn nguyên.
      # Skip ở đây là skip CÓ CHỨNG CỨ (đo diff thật), khác skip vì cấu hình.
      - name: Xác định diff có đụng schema/generator không
        id: schema_doi
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MOC="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Chạy tay là muốn đo thật — không skip.
            echo "doi=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            MOC="${{ github.event.before }}"
            # Push đầu tiên của nhánh (before toàn số 0) → không có mốc, chạy đủ.
            case "$MOC" in 0000000*) echo "doi=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          fi
          if git diff --name-only "$MOC"...HEAD -- \
              supabase/migrations supabase/baseline \
              scripts/gen-supabase-types.mjs scripts/normalize-supabase-types.mjs \
              scripts/generate-openclaw-pglite-types.mjs \
              scripts/check-local-types-parity.mjs \
              supabase/generated-types-policy.json \
              src/integrations/supabase/types.ts | grep -q .; then
            echo "doi=true" >> "$GITHUB_OUTPUT"
          else
            echo "doi=false" >> "$GITHUB_OUTPUT"
            echo "Diff không đụng schema/generator — bỏ qua replay PGlite (kết luận lần trước còn nguyên giá trị)."
          fi

      - name: Setup Node 24.18.0
        if: steps.schema_doi.outputs.doi == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        if: steps.schema_doi.outputs.doi == 'true'
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Install root dependencies
        if: steps.schema_doi.outputs.doi == 'true'
        run: npm ci

      - name: Deterministic local generated-types drift
        if: steps.schema_doi.outputs.doi == 'true'
        env:
          SUPABASE_TYPES_SOURCE: local
          SUPABASE_TYPES_LOCAL_ENGINE: pglite
        run: |
          # Bản cũ: `npm run gen:types` rồi `git diff --exit-code`. Hỏng HAI chỗ.
          #
          # 1. Thiếu `types:normalize`. Generator xuất bản thô có phân mảnh runtime;
          #    file đã commit là bản ĐÃ chuẩn hoá (Contract §6). Đúng khiếm khuyết
          #    đã vá ở 43ebc8bb cho job anh em generated-types-drift. (Ghi chú cũ
          #    "job này chưa từng chạy vì quality-gates đỏ 168 lượt" đã hết đúng —
          #    quality-gates xanh ổn định từ 22/08 và job này chạy thật.)
          #
          # 2. So BYTE giữa hai BỘ NỘI SUY khác nhau. Kể cả khi đã chuẩn hoá,
          #    `git diff` vẫn cho 10.069 thêm / 10.229 xoá — nhưng so theo nội
          #    dung thì bản migration KHÔNG thừa dòng nào và chỉ thiếu 160 dòng,
          #    toàn bộ là `isOneToOne: false`. Phần còn lại thuần là thứ tự khoá.
          #    Cả hai khác biệt thuộc về engine (PGlite vs Postgres hosted), không
          #    thuộc về schema — bắt chúng trùng byte là đòi hai engine cho ra
          #    output y hệt, chẳng liên quan gì tới câu hỏi cần trả lời.
          #
          # Câu hỏi cần trả lời là: replay migration có dựng lại ĐÚNG schema
          # production không. check-local-types-parity.mjs hỏi đúng câu đó, và
          # vẫn bắt được mọi bảng/cột/hàm/enum thiếu hoặc thừa.
          cp src/integrations/supabase/types.ts "$RUNNER_TEMP/types-production.ts"
          npm run gen:types
          npm run types:normalize
          node scripts/check-local-types-parity.mjs \
            "$RUNNER_TEMP/types-production.ts" \
            src/integrations/supabase/types.ts
          git checkout -- src/integrations/supabase/types.ts
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_pat == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency
        run: npm ci

      # Gate ACL (AUTHORIZATION-PLAN §9.3 điểm 9): chặn SECURITY DEFINER function
      # mới anon-executable ngoài allowlist baseline (chống drift quyền anon).
      - name: Definer ACL drift (SECURITY DEFINER anon-executable)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-definer-acl.mjs

      # Gate view: mọi VIEW public phải security_invoker=true — án lệ
      # CREATE OR REPLACE VIEW làm rớt cờ này, lộ dữ liệu tenant khác.
      - name: View security_invoker (chống lộ dữ liệu xuyên tenant qua view)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-view-invoker.mjs

      # Gate provenance (AUTHORIZATION-PLAN §20-10): phiếu APPROVED thiếu
      # approver mà cũng thiếu system_source = có writer legacy sống lại ngoài
      # đường canonical. Bắt regress thay vì để số liệu audit trôi âm thầm.
      - name: Approver provenance (chống writer legacy tạo phiếu tự-duyệt)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-approver-provenance.mjs

      # Khoá quyền có trong DB mà FE không có nhãn = quyền VÔ HÌNH: không ai
      # cấp/thu hồi được từ bảng phân quyền. Ngày 26/07 đã đo lệch đúng 11 khoá.
      # Chiều ngược lại (nhãn trỏ khoá không có) thì tick vào là bị RPC từ chối.
      - name: Catalog quyền FE khớp permission_definitions
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-permission-catalog.mjs


      # Ledger supabase_migrations phải ĐỨNG YÊN: forward-only lane cố ý không
      # backfill nó, nên mọi thay đổi nghĩa là ai đó đã dùng đường khác. Quan
      # trọng vì migration-provenance.json xếp 351 file là `ledger-applied` DỰA
      # TRÊN bảng này — viết lại bảng thì 351 khẳng định xuất xứ mất căn cứ mà
      # không có lỗi nào phát ra.
      - name: Sổ ledger migration không bị viết lại
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-migration-ledger-frozen.mjs

      # Migration sau cutoff phải chạy lại được lần hai. Re-apply xảy ra khi apply
      # hỏng giữa chừng, khi dựng lại môi trường từ baseline + forward lane, và khi
      # hợp thức hoá một thay đổi đã đi đường tắt — cả ba đều là lúc người ta vội.
      # Chạy trên production nhưng KHÔNG ghi: hai lượt trong một transaction, ROLLBACK.
      - name: Migration forward chạy lại được lần hai (idempotent)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-forward-migration-idempotent.mjs

      # BA BIÊN mà hợp đồng chỉ là MỘT CHUỖI, và không trình biên dịch nào kiểm
      # được: tên RPC, slug Edge Function, tên bảng realtime. types.ts có kiểu RPC
      # nhưng chỉ che phần src/ được tsc soi — Edge Function chạy Deno, services/
      # và infra/ nằm ngoài hoàn toàn. Manifest sinh từ HAI nguồn (call site +
      # catalog live) theo plan §P1.7, và đỏ khi hai nguồn không giao nhau đúng.
      - name: Bề mặt RPC · Edge · realtime khớp catalog live
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          node scripts/check-rpc-surface.mjs
          node scripts/check-edge-surface.mjs
          node scripts/check-realtime-surface.mjs
          # Lớp sâu hơn ba cái trên: chúng canh RPC có TỒN TẠI, cái này canh TÊN
          # THAM SỐ. PostgREST phân giải hàm bằng tham số có tên, nên sai một tên
          # là cả lời gọi hỏng với PGRST202 "không tìm thấy hàm" — thông báo đó
          # dẫn người sửa đi tìm migration thiếu thay vì nhìn vào tên tham số.
          # Đọc manifest đã sinh, KHÔNG tự gọi mạng.
          node scripts/check-rpc-arg-names.mjs
          # KHOẢNG MÙ của chính ba gate trên: chúng tìm tên RPC bằng chuỗi viết
          # thẳng, nên lời gọi có tên đi qua biến thì cả ba đều không thấy. Gate
          # này đếm và khoá phần mù đó lại (đo 12/08/2026: 31/270 = 11,5%).
          node scripts/check-rpc-name-literal.mjs
          # Tầng: `supabase.rpc()` không được gọi thẳng trong component. Gom về
          # hook/lib thì hai gate trên có ít điểm phải soi hơn, và quyền sở hữu
          # query key nằm cùng chỗ với lời gọi.
          node scripts/check-rpc-layer.mjs
          # Tầng KEY của realtime: check-realtime-descriptors chặn ba nguồn ở tầng
          # BẢNG (publication ↔ hub ↔ descriptor), không gì chặn tầng key.
          # `invalidateQueries` khớp theo prefix và IM LẶNG khi không khớp ai.
          node scripts/check-realtime-key-ownership.mjs
          # NỐI VÀO CI 26/08/2026 — trước đó gate này MỒ CÔI: không workflow nào
          # gọi nó, trong khi CTE của nó bị CHÉP NGUYÊN VĂN vào
          # kiem-bao-mat-sau-khoi-phuc.mjs (chạy trong restore-drill). Bản gốc
          # không ai chạy thì hai bản sẽ trôi khỏi nhau trong im lặng — chạy nó
          # ở đây (job đã có PAT sẵn) là cách rẻ nhất giữ nguồn còn sống.
          node scripts/check-stable-fn-locks.mjs

      # MỌI bảng có organization_id phải có một chỗ đứng: đã rào, đang chờ vá ở
      # một giai đoạn có tên, hoặc miễn trừ CÓ LÝ DO ĐO ĐƯỢC VÀ CÓ HẠN. Nhóm thứ
      # tư — "chưa ai nhận" — là thứ gate này sinh ra để tìm.
      #
      # Khuyết tật gốc của cả chuyện tách dữ liệu: 20260713121000_sprint3b gắn
      # biên giới theo DANH SÁCH VIẾT TAY 28 bảng, nên mọi bảng ra đời sau đều
      # thiếu — âm thầm hơn một năm, tới lúc đo mới lòi ra 272 bảng không có ranh
      # giới nào giữa các công ty. Event trigger org_boundary_tu_dong chặn ở tầng
      # database; gate này là lưới vét, và cũng là chỗ canh sổ miễn trừ quá hạn.
      - name: Mọi bảng có organization_id đều có chỗ đứng
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/build-org-boundary-inventory.mjs --check

      # Đo rò xuyên tổ chức bằng VAI NGƯỜI DÙNG THẬT (SET ROLE + JWT), chỉ đọc,
      # mọi truy vấn bọc ROLLBACK.
      #
      # CHẶN theo vị từ =0, KHÔNG theo số dòng tuyệt đối: dữ liệu nghiệp vụ thay
      # đổi hằng ngày nên chốt "phải đúng 224 dòng" sẽ đỏ giả liên tục rồi bị tắt
      # đi — và khi ấy rò thật cũng không ai thấy. "visible_foreign = 0" thì tất
      # định vĩnh viễn.
      #
      # Ba mã thoát có ý nghĩa khác nhau: 0 sạch · 1 CÓ RÒ · 3 bốn chốt chống ảo
      # giác hỏng, tức số đo không đáng tin (nguy hiểm hơn có rò, vì nó im lặng).
      - name: Không rò dữ liệu xuyên tổ chức (đo bằng vai người dùng thật)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/measure-org-leak.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Optional: phát hiện types.ts (Supabase generated types) trôi so với schema.
  # Cần SUPABASE_ACCESS_TOKEN (Supabase CLI).
  # ─────────────────────────────────────────────────────────────────────────
  generated-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_cli_token == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency
        run: npm ci

      - name: Gen types từ DB thật rồi so với src/integrations/supabase/types.ts đã commit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # scripts/gen-supabase-types.mjs GHI THẲNG vào src/integrations/supabase/types.ts
          # (outputPath hardcode ở :192) và TỰ chèn header (:9/:79). stdout chỉ có banner npm.
          # Bản cũ `npm run gen:types > /tmp/x.ts` hỏng cả hai vế: vế phải là banner, vế trái
          # đã bị script ghi đè trước khi diff chạy ⇒ job luôn exit 1. Phải sao lưu trước.
          #
          # PHẢI CHUẨN HOÁ TRƯỚC KHI DIFF — đây là lỗi thứ hai của cùng bước này, sửa
          # 12/08/2026. `gen:types` sinh bản THÔ (32.985 dòng, gồm 92 partition
          # `*_YYYYMMDD` của bảng mẫu realtime), còn file được commit là bản ĐÃ BỎ
          # partition (28.569 dòng — xem `npm run types:normalize`, và Contract §6 quy
          # định đúng thứ tự gen → normalize → check). Thiếu bước normalize thì diff luôn
          # lệch đúng 92 bảng đó, tức job KHÔNG BAO GIỜ xanh được dù schema khớp hoàn
          # toàn. Đã đo: sau khi thêm normalize, diff rỗng trên cùng SHA mà CI báo trôi.
          cp src/integrations/supabase/types.ts /tmp/types.committed.ts
          npm run gen:types
          npm run types:normalize
          diff -u /tmp/types.committed.ts src/integrations/supabase/types.ts \
            && echo "✅ types.ts khớp schema DB — không trôi." \
            || { echo "❌ types.ts TRÔI so với schema thật — chạy: npm run gen:types (script tự ghi + tự thêm header, KHÔNG redirect)"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────
  # Optional: đối chiếu tiền 3 nguồn độc lập (bug class cap-1000 PostgREST).
  # Cần SUPABASE_PAT + tài khoản test thật (JWT/RLS).
  # ─────────────────────────────────────────────────────────────────────────
  reconcile-money:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_test_creds == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (cần @supabase/supabase-js)
        run: npm ci

      # VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY đọc từ file .env đã
      # commit trong repo (anon key công khai theo thiết kế) — không cần secret.
      - name: Đối chiếu tiền — 3 nguồn độc lập (SQL SUM / RPC RLS / phân trang FE)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: node scripts/reconcile-money.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Optional: ma trận âm bản cách ly tenant (integration test chống rò rỉ
  # xuyên-tenant). Cần SUPABASE_PAT. Thao tác trong BEGIN…ROLLBACK.
  # ─────────────────────────────────────────────────────────────────────────
  cross-tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_pat == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Ma trận âm bản cách ly tenant (OWNER/ADMIN/FULL-SCOPE staff)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/test-cross-tenant.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Quét secret TOÀN LỊCH SỬ.
  #
  # Đợt 0a #3 của plan đòi việc này. Nó ĐÃ được chạy một lần (số liệu ghi ở
  # tooling/program-status.json) nhưng không để lại artifact và không có cơ chế
  # chạy lại — tức là một lần kiểm, không phải một cửa chặn. Bằng chứng chứng
  # minh nó SẠCH LÚC ĐÓ không chứng minh nó SẠCH BÂY GIỜ; đây đúng là kiểu hỏng
  # đã cắn hai lần trong ngày 07/08 (backup đứt âm thầm, baseline chưa từng
  # restore thật).
  #
  # Cài binary pin theo VERSION + SHA256 thay vì dùng gitleaks-action: action v2
  # đòi GITLEAKS_LICENSE cho tổ chức, và một cửa chặn phụ thuộc giấy phép bên thứ
  # ba là một cửa chặn sẽ tắt vào ngày không ai muốn.
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/production'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # BẮT BUỘC: quét toàn lịch sử. Checkout nông chỉ thấy một commit, và
          # gitleaks sẽ báo "no leaks found" — xanh rỗng, đúng thứ tệ nhất.
          fetch-depth: 0
          persist-credentials: false

      - name: Cài gitleaks (pin version + sha256)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Chốt chặn xanh-rỗng — phải thật sự có lịch sử để quét
        run: |
          set -euo pipefail
          COMMITS=$(git rev-list --count HEAD)
          echo "Lịch sử: $COMMITS commit"
          if [ "$COMMITS" -lt 500 ]; then
            echo "::error::Chỉ thấy $COMMITS commit (sàn 500). Checkout nông ⇒ 'no leaks found' là vô nghĩa."
            exit 1
          fi

      - name: Quét toàn lịch sử
        run: /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .

      # Artifact graph là một loại rủi ro RIÊNG, không nằm trong bước trên.
      #
      # `gitleaks git` quét COMMIT. Nó bắt secret bị commit — nhưng
      # .ua/knowledge-graph.json là 8 MB văn bản do LLM sinh ra sau khi đọc toàn
      # repo (kể cả fixture, seed, migration có dữ liệu mẫu), rồi được commit và
      # push công khai. Hai thứ gitleaks KHÔNG bắt:
      #   - PII khách hàng (số điện thoại, email) — không có luật nào cho nó
      #   - và diff 8 MB JSON thì không ai review bằng mắt để bù lại
      # Đo thật 08/08/2026: gitleaks trả "no leaks found" trên .ua/, trong khi
      # cần một phép kiểm riêng cho trường văn bản. Đặt ở job này vì binary
      # gitleaks đã có sẵn — tải lần nữa ở job khác là lãng phí và dễ lệch version.
      - name: Secret + PII trên artifact graph (.ua/)
        env:
          GITLEAKS_BIN: /tmp/gitleaks
        run: node scripts/check-graph-secrets.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Ba cửa chặn về TRI THỨC (graph UA/GitNexus) gom về một chỗ có tên.
  #
  # Trước 11/08/2026 chúng nằm rải ở ba bước của hai job khác nhau, nên không
  # đọc được "phần tri thức có xanh không" mà phải đi tìm từng bước một.
  #
  # KHÔNG gom `check-graph-secrets.mjs` vào đây, và đó là quyết định chứ không
  # phải bỏ sót: nó cần binary gitleaks, mà binary đó đã được tải trong job
  # `security-gates`. Tải lần thứ hai vừa lãng phí vừa dễ lệch version — chú
  # thích tại chỗ đó đã cân nhắc và kết luận vậy từ trước. Ở đây chỉ ghi con trỏ.
  # ─────────────────────────────────────────────────────────────────────────
  # Hợp đồng realtime: bảng hub lắng nghe phải nằm trong publication thật.
  #
  # VÌ SAO TÁCH RA KHỎI `security-gates` (11/08/2026)
  #   Bước này trước nằm trong security-gates, mà job đó có
  #   `if: github.ref == refs/heads/main && (push || workflow_dispatch)`. Nghĩa là
  #   trên PULL REQUEST nó KHÔNG BAO GIỜ chạy — phép kiểm chỉ nói cho ta biết sau
  #   khi thay đổi đã vào main. Với một lỗi IM LẶNG (subscribe câm: Supabase không
  #   đẩy sự kiện, không lỗi, không cảnh báo, giao diện chỉ ngừng tự cập nhật) thì
  #   biết sau khi merge gần như là không biết.
  #
  #   Đây cũng không phải phép kiểm BẢO MẬT — nó là hợp đồng đúng/sai. Nằm trong
  #   security-gates chỉ vì ở đó sẵn có PAT.
  #
  # THIẾU PAT ⇒ ĐỎ, không phải bỏ qua
  #   Repo này private và mọi PR đến từ nhánh trong CÙNG repo, nên secret luôn có.
  #   Không có PAT nghĩa là secret bị gỡ hoặc hết hạn — đó là chuyện phải biết,
  #   không phải điều kiện bình thường để im lặng cho qua. Script tự thoát 3.
  # 26/08/2026 — gộp từ HAI job (`realtime-contract-gates` + job này). Mỗi job
  # từng trả một lượt checkout + setup Node + `npm ci` (~60–90 giây máy) chỉ để
  # chạy tổng cộng 3 script vài giây. Gộp lại tiết kiệm nguyên một lượt dựng
  # runner mỗi run mà không mất phép đo nào — ba step vẫn nguyên tên, vẫn đỏ
  # độc lập như cũ. `fetch-depth: 0` giữ theo yêu cầu của cặp graph.
  realtime-and-knowledge-gates:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/production'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # check-graph-hygiene duyệt TOÀN LỊCH SỬ các commit đụng .ua/ để cưỡng
          # chế luật "refresh graph đi PR riêng" (Contract §12 luật #6), và
          # check-graph-freshness đo độ lệch từ baseCommit. Checkout nông làm cả
          # hai thành "không kiểm được" (exit 3), không phải "đạt".
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'

      - name: Cài phụ thuộc
        run: npm ci

      - name: Bảng realtime hub lắng nghe đều được publish
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-realtime-descriptors.mjs

      # Vệ sinh graph — CHẶN. Ba phép kiểm: manifest khớp artifact, refresh đi PR
      # riêng, và graph KHÔNG được đè bản luật quy định chính nó (Contract,
      # CLAUDE.md, AGENTS.md, AI_RULES.md).
      - name: Vệ sinh graph (manifest · PR riêng · không đè Contract)
        run: node scripts/check-graph-hygiene.mjs

      # Độ mới graph — CỐ Ý KHÔNG CHẶN. Plan kiến trúc (dòng 119, 2271) đã chốt UA
      # freshness không phải required check: graph 4 MB commit vào repo, refresh là
      # cả một PR, nên đỏ CI mỗi khi nó cũ sẽ khiến người ta tắt gate đi. Chế độ mặc
      # định (không cờ --nhiem-vu) in đủ số đo rồi thoát 0 khi graph cũ; nó CHỈ đỏ
      # khi artifact hỏng hoặc không tự nhất quán — tức "không kết luận được".
      # Cửa chặn cứng nằm ở máy dev, theo nhiệm vụ (Contract §12 luật #1, #2).
      - name: Độ mới graph (báo cáo — chỉ đỏ khi artifact hỏng)
        run: node scripts/check-graph-freshness.mjs
  # ─────────────────────────────────────────────────────────────────────────
  # Nhánh `production` là thứ Vercel phát hành. Push thẳng vào đó = phát hành mã
  # chưa từng qua CI của main. Branch protection KHÔNG bật được (repo private
  # trên GitHub Free — đo ở docs/generated/external-controls.json), nên cửa chặn
  # khả thi duy nhất là kêu SAU push. Kêu sau vẫn hơn không biết.
  # ─────────────────────────────────────────────────────────────────────────
  production-promotion:
    if: github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lấy về cả main để so
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Mọi commit đang phát hành đều đã qua main
        run: node scripts/check-production-promotion.mjs

      # Cửa chặn thứ hai, và là cửa duy nhất đọc KẾT LUẬN GATE.
      #
      # check-production-promotion chỉ hỏi "commit này đã có trên main chưa" —
      # nó không hỏi gate của commit đó có xanh không. Bước dưới đọc kết luận ở
      # mức BƯỚC, nên một bước fail bị continue-on-error nuốt (job vẫn báo
      # success, trang Checks vẫn màu xanh) vẫn bị chặn.
      #
      # Thiếu token ⇒ exit 3 và job đỏ: "không hỏi được CI" KHÁC "CI xanh".
      - name: Kết luận gate của commit đang phát hành
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/promote-to-production.mjs --sha "${{ github.sha }}"

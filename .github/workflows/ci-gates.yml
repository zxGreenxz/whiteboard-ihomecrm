# CI Gates — bật tự động các cổng kiểm chất lượng/bảo mật hiện chỉ chạy TAY
# (P1 từ đợt tổng kiểm authorization). Không sửa/tạo gì khác ngoài file này.
#
# Job "quality-gates" là bắt buộc, chạy trên mọi PR/push KHÔNG cần secret nào
# (typecheck/lint/build/vitest) và KHÔNG dùng continue-on-error — lệnh fail thì
# job fail. Nhờ vậy CI XANH ngay khi merge file này, không đỏ vì thiếu secret.
#
# Các gate cần Supabase PAT / Management API / tài khoản test được tách RIÊNG,
# chỉ chạy trên refs/heads/main qua push hoặc workflow_dispatch, và chỉ khi
# maintainer đã cấu hình secret. PR và release/* chỉ chạy các gate không secret.
# Job "preflight" đọc secret ra output cho các job optional `needs: preflight`.
#
# Secrets cần cấu hình (Settings → Secrets and variables → Actions):
#   - SUPABASE_PAT            : Supabase Management API personal access token
#                                → BẬT "security-gates" (definer-acl, view-invoker)
#                                + cross-tenant-isolation + (cùng test creds) reconcile.
#   - SUPABASE_ACCESS_TOKEN   : access token cho Supabase CLI (job gen:types drift —
#                                cùng cơ chế .github/workflows/supabase-migrate.yml).
#   - SUPABASE_TEST_EMAIL / SUPABASE_TEST_PASSWORD : tài khoản test (JWT thật, RLS)
#                                dùng cho reconcile-money (nguồn B/C).
#
# GỢI Ý: thêm SUPABASE_PAT sớm để 2 gate ACL/view-invoker (chống drift quyền anon
# + lộ view xuyên-tenant) có hiệu lực trên push/manual của refs/heads/main.

name: CI Gates

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      # `production` là nhánh Vercel phát hành. Trước đây nó KHÔNG được theo dõi,
      # nên một push thẳng vào đó không kích hoạt gate nào — đúng nhánh nguy hiểm
      # nhất lại là nhánh duy nhất không ai canh.
      - production
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Preflight: kiểm secret nào đã cấu hình, xuất ra output cho các job optional.
  # (Không thể dùng secrets.* trong `if:` cấp job → phải qua bước này.)
  # ─────────────────────────────────────────────────────────────────────────
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pat: ${{ steps.check.outputs.has_pat }}
      has_cli_token: ${{ steps.check.outputs.has_cli_token }}
      has_test_creds: ${{ steps.check.outputs.has_test_creds }}
    steps:
      - id: check
        env:
          PAT: ${{ secrets.SUPABASE_PAT }}
          CLI: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TE: ${{ secrets.SUPABASE_TEST_EMAIL }}
          TP: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: |
          echo "has_pat=$([ -n "$PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_cli_token=$([ -n "$CLI" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_test_creds=$([ -n "$PAT" ] && [ -n "$TE" ] && [ -n "$TP" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Gate bắt buộc (KHÔNG cần secret): typecheck, lint, build, test.
  # Luôn chạy, xanh được ngay — không phụ thuộc PAT.
  # ─────────────────────────────────────────────────────────────────────────
  quality-gates:
    runs-on: ubuntu-latest
    # KHÔNG chạy lại trên nhánh `production`.
    #
    # Promote là fast-forward một commit ĐÃ xanh trên main. Chạy lại toàn bộ
    # workflow ở đó tốn thêm ~12 phút mỗi lần phát hành mà không trả lời thêm
    # câu hỏi nào: job `production-promotion` bên dưới đã cưỡng chế cả hai vế
    # — commit phải nằm trên main (check-production-promotion.mjs) VÀ kết luận
    # gate của đúng SHA đó phải xanh ở mức BƯỚC (promote-to-production.mjs).
    # Một push thẳng vào production mà không qua main vẫn bị chặn ở đó.
    if: github.ref != 'refs/heads/production'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # fetch-depth: 0 — checkout mặc định là SHALLOW (chỉ 1 commit).
          # check-graph-hygiene.mjs phải duyệt lịch sử các commit đụng .ua/ để
          # cưỡng chế luật "refresh graph đi PR riêng" (Contract §12 luật #6), và
          # check-graph-freshness.mjs đo độ lệch từ baseCommit của graph. Với
          # repo nông, cả hai thoát 3 ("không kiểm được ≠ đạt") thay vì im lặng
          # cho qua — nhưng như vậy thì gate không bao giờ thật sự chạy trên CI.
          fetch-depth: 0

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (npm ci — khớp package-lock.json)
        id: caidat
        run: npm ci

      # ─── MỘT LƯỢT PHƠI HẾT LỖI ───────────────────────────────────────────
      # Từ đây xuống, mọi bước gate mang điều kiện `!cancelled()` + caidat xanh:
      # một bước đỏ KHÔNG chặn các bước sau chạy nữa. Job vẫn ĐỎ nếu bất kỳ bước
      # nào đỏ — đây không phải continue-on-error (Contract §3 cấm tính nó là
      # xanh), chỉ là bỏ kiểu dừng-ở-lỗi-đầu-tiên.
      #
      # Vì sao: ngày 13/08/2026 một đợt tính năng cần 5 VÒNG sửa-push-chờ kéo 19
      # tiếng, vì mỗi lượt chạy chỉ lộ đúng MỘT bước đỏ rồi giấu các bước sau
      # (restore drill → idempotent → docs-freshness → docs-freshness → đảo
      # strict). Tổng thời gian máy chạy cả ngày chưa tới một giờ; phần còn lại
      # là số vòng. Chạy hết các bước độc lập thì một lượt push thấy đủ mọi lỗi.
      #
      # Ngoại lệ duy nhất: bước "Bundle" cần dist/ nên chỉ chạy khi "Build" xanh.
      # Các khối gộp nhiều script cũng gom lỗi (`|| loi=1` … `exit $loi`) thay vì
      # `bash -e` chết ở script đầu — cùng lý do, tầng trong của cùng một luật.
      # ─────────────────────────────────────────────────────────────────────

      - name: OpenClaw isolation boundary
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-openclaw-isolation.mjs

      # BA NHÓM GATE TĨNH theo plan §31 — nhưng là ba STEP, không phải ba JOB.
      #
      # Plan §0.6 muốn gộp 8 job thành 3 để "giảm bề mặt bảo trì và số nơi có thể
      # kẹt merge". Repo đi xa hơn: gộp về MỘT job. Tinh thần đã đạt, chỉ thiếu
      # phần đặt tên — mà tên job chỉ có giá trị khi bật được required check, và
      # điều đó bất khả ở tier hiện tại (repo private trên GitHub Free — đo ở
      # docs/generated/external-controls.json).
      #
      # Chia thành ba step CÓ TÊN thì được đúng phần giá trị còn lại mà không tốn
      # gì: giao diện PR chỉ ra ngay NHÓM nào đỏ, thay vì một khối 19 lệnh mà
      # phải mở log mới biết cái nào. Ba runner khởi động thì không.
      #
      # Việc cố ý KHÔNG tách thành job riêng đã đăng ký ở tooling/known-gaps.yaml
      # (ci-gates-mot-job-thay-vi-ba) — để deliverable không treo lơ lửng.

      - name: contract-gates (luật agent · bề mặt sản phẩm · runtime pin · known-gap hết hạn)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          loi=0
          node scripts/check-agent-contract.mjs || loi=1
          node scripts/check-runtime-matrix.mjs || loi=1
          node scripts/check-known-gaps.mjs || loi=1
          node scripts/check-capability-surfaces.mjs || loi=1
          node scripts/check-route-permission-drift.mjs || loi=1
          node scripts/check-capability-docs.mjs || loi=1
          node scripts/check-baseline-doc.mjs || loi=1
          node scripts/check-route-guards.mjs || loi=1
          node scripts/check-test-matrix.mjs || loi=1
          node scripts/check-workflow-paths.mjs || loi=1
          node scripts/check-raw-rpc-callers.mjs || loi=1
          node scripts/check-realtime-query-keys.mjs || loi=1
          node scripts/check-evidence-store.mjs || loi=1
          node scripts/check-test-only-exports.mjs || loi=1
          node scripts/check-unknown-review.mjs || loi=1
          node scripts/check-ts-suppressions.mjs || loi=1
          node scripts/check-rpc-cast-ratchet.mjs || loi=1
          node scripts/check-rpc-in-view-ratchet.mjs || loi=1
          node scripts/check-error-swallow-ratchet.mjs || loi=1
          exit $loi

      - name: schema-gates (provenance migration · canonical types · đường ghi production)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          loi=0
          node scripts/check-migration-provenance.mjs || loi=1
          node scripts/normalize-supabase-types.mjs --check || loi=1
          node scripts/check-no-auto-apply.mjs || loi=1
          node scripts/check-management-api-writes.mjs || loi=1
          node scripts/check-promote-readiness.mjs || loi=1
          node scripts/check-migration-test-liveness.mjs || loi=1
          exit $loi

      # Tách riêng vì bước này GỌI RA MẠNG (npm audit + npm ls đọc registry).
      # Gộp vào "Contract gates" thì một lượt registry hỏng sẽ làm cả khối gate
      # tĩnh đỏ theo, và người đọc log không biết cái nào thật sự vi phạm.
      # Gate tự thoát 3 khi không hỏi được registry — 3 nghĩa là KHÔNG ĐO ĐƯỢC,
      # không phải "sạch".
      - name: Lỗ hổng phụ thuộc — phân tầng theo tầm với, mỗi mục có hạn ký nhận
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-dependency-audit.mjs

      - name: docs-freshness (Copilot manifest · số đếm tài liệu)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          loi=0
          node scripts/check-copilot-docs-manifest.mjs || loi=1
          # Whitelist ĐIỀU HƯỚNG của Copilot: route sai ⇒ nó báo "✅ Đã mở trang"
          # rồi đưa người dùng tới màn trắng; module quyền sai ⇒ nó báo "không có
          # quyền" cho người ĐANG có quyền. Cả hai đều là chuỗi, tsc không bắt được.
          node scripts/check-copilot-routes.mjs || loi=1
          # NỐI 26/08/2026 — nghịch lý cũ: TEST của gate này chạy trong CI (bước
          # node --test) mà chính gate thì chưa từng chạy ở đâu. Gate tĩnh, <1s.
          node scripts/check-copilot-tool-inventory.mjs || loi=1
          node scripts/check-doc-counts.mjs || loi=1
          node scripts/check-doc-freshness.mjs || loi=1
          node scripts/generate-docs-views.mjs --check || loi=1
          exit $loi
      - name: Module mới phải strict ngay từ đầu
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-new-modules-strict.mjs

      # BAO CAO, khong phai cua chan: in tier rui ro + gate bat buoc cua PR nay.
      # No KHONG kiem duoc ban da chay cac gate do hay chua — khong co dau vet nao
      # trong repo de doc. Muc dich la de nguoi review thay ngay minh dang nhin gi.
      - name: Phan loai rui ro thay doi (bao cao)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-risk-classifier.mjs


      - name: Typecheck baseline (gate chính — chặn lỗi TS MỚI so với ts-baseline.json)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: npm run typecheck:baseline

      # ĐÃ GỠ: `npx tsc --noEmit -p tsconfig.app.json` chạy TRẦN.
      #
      # Bước đó đòi 0 lỗi, trong khi ts-baseline.json khai đúng 2 lỗi đã biết —
      # tức nó mâu thuẫn với chính cơ chế mà TÊN nó trỏ người đọc tới. Nó chưa
      # bao giờ xanh: quality-gates 0/167 lần xanh trong toàn bộ lịch sử GitHub
      # còn giữ cho nhánh main (từ 07/08/2026), và trước hôm nay nó còn chưa
      # từng ĐƯỢC CHẠY vì các bước đứng trước luôn đỏ sớm hơn.
      #
      # NGUYÊN NHÂN GỐC của cả 2 lỗi là MỘT, và nó không nằm ở hai file kia:
      # tsconfig.app.json đặt `"strict": false`, kéo theo strictNullChecks tắt.
      # Zod 3 nói rõ nó cần strictNullChecks; thiếu cờ đó thì `z.infer` thoái
      # hoá và MỌI khoá của schema suy ra thành optional — kể cả khoá khai
      # `z.string().min(1)`. Đó đúng là hình dạng trong thông báo lỗi:
      # `{ label?: string; type?: …; amount?: number }` cho một schema mà cả ba
      # khoá đều bắt buộc. Nên "sửa hai lỗi này" thực chất là "bật strict cho
      # toàn app" — đúng cuộc di trú mà check-strict-islands.mjs đang làm dần
      # theo từng vùng, không phải việc kèm vào một PR khác.
      #
      # KHÔNG MẤT GÌ khi gỡ. Bước "Typecheck baseline" ngay trên chạy CHÍNH XÁC
      # cùng lệnh biên dịch (tsc --noEmit -p tsconfig.app.json, xem
      # scripts/check-ts-baseline.mjs) rồi kiểm chặt hơn ba tầng: đối chiếu
      # multiset fingerprint để một lỗi cũ không cấp phép cho lỗi mới cùng dạng,
      # cross-check số dòng parse được với "Found N errors" của tsc để phát hiện
      # parser trôi, và một SÀN ĐỘ PHỦ chặn việc thu hẹp include/exclude cho đỡ
      # lỗi. Ratchet chỉ đi một chiều: baseline đã teo còn 2 mục.
      #
      # Bước này sẽ quay lại — dưới dạng khẳng định ts-baseline.json RỖNG — khi
      # đảo strict phủ hết src/. Lúc đó nó mới nói được điều nó đang tự nhận.

      # Đổi từ `npm run lint` TRẦN sang ratchet.
      #
      # Bước cũ đòi ESLint sạch tuyệt đối trên vùng repo tự sở hữu. Đo 12/08/2026
      # trên đúng bộ ignore này: 1714 file, **1201 lỗi** — 1179 trong đó là
      # @typescript-eslint/no-explicit-any. Không PR nào dọn nổi 1201 lỗi, nên
      # cửa đó chỉ có hai kết cục: đỏ vĩnh viễn hoặc bị tắt; cả hai đều mất khả
      # năng chặn lỗi MỚI, tức mất đúng thứ nó sinh ra để giữ.
      #
      # Nó đang là kết cục thứ nhất mà không ai thấy: bước này CHƯA TỪNG CHẠY.
      # quality-gates 0/167 lần xanh trong toàn bộ lịch sử GitHub còn giữ cho
      # main (từ 07/08/2026), và job luôn dừng ở một bước đứng trước.
      #
      # Ratchet giữ nguyên phép đo (cùng lệnh, cùng bộ ignore) nhưng đổi câu hỏi
      # từ "có lỗi không" sang "có lỗi MỚI không", cộng một sàn độ phủ để việc
      # nới `ignores` không làm cửa xanh lên. Cùng khuôn với ts-baseline, và
      # multiset giữ trùng lặp nên `any` thứ 92 trong một file đã có 91 vẫn đỏ.
      - name: Lint root-owned code (ratchet — chặn lỗi MỚI, nợ cũ khai ở eslint-baseline.json)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-eslint-baseline.mjs

      - name: Build (vite build — bắt lỗi build-time không lộ ở tsc/eslint)
        id: build
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: npm run build

      # Kiểm ngay sau build, khi dist/ còn nguyên. 99 trang khai lazy(); chỉ cần
      # MỘT chỗ import thẳng một trang là nó bị gộp vào chunk entry và người dùng
      # tải thêm vài trăm KB ở lần mở đầu. Không có gì hỏng — build xanh, test
      # xanh, giao diện đúng — nên không ai phát hiện trừ khi có phép đo này.
      # Cần dist/ nguyên vẹn nên là bước DUY NHẤT điều kiện theo Build, không theo caidat.
      - name: Bundle không có hồi quy eager-import
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: node scripts/generate-bundle-inventory.mjs

      # Keep root discovery inside root-owned suites. Node-only packages run in
      # openclaw-package-gates, so Bridge node:sqlite tests are never collected here.
      # scripts/__tests__/network-center-*.test.mjs dùng API `node:test`, KHÔNG
      # phải Vitest. Chúng do `node --test` chạy trong workflow network-center.
      # Để Vitest quét thì cả 22 file fail với "No test suite found in file" —
      # đo được 06/08/2026. Job này khi đó đỏ vì lý do chẳng liên quan gì tới
      # chất lượng code, và một CI đỏ thường trực là thứ khiến người ta ngừng
      # đọc kết quả CI.
      # Những file này dùng API `node:test`, KHÔNG phải Vitest. Trước 11/08/2026
      # matrix xếp chúng vào suite Vitest và CI không loại trừ — nên bước Vitest
      # ĐỎ vì chúng, và đồng thời KHÔNG lệnh nào chạy chúng. File test tồn tại
      # trong repo mà chưa từng được thi hành: tệ hơn không có test, vì nhìn vào
      # thư mục thì thấy "đã có test".
      #
      # VÀ VẾT ĐÓ ĐÃ TÁI DIỄN: 7 file dưới (từ `check-copilot-routes` trở xuống)
      # là gate viết sau ngày 11/08, mỗi cái lại dùng `node:test` mà không ai nối
      # vào đây. Đo 12/08/2026: chúng chứa 77 test, tất cả đều xanh, và tất cả đều
      # CHƯA TỪNG chạy trong CI. `npm run gate:test-matrix` là thứ phát hiện ra —
      # nó đã đỏ sẵn, chỉ là chưa ai đọc.
      #
      # Thêm gate mới dùng `node:test` thì phải sửa BA chỗ: bước này, danh sách
      # `--exclude` của Vitest ngay dưới, và `node-native.includes` trong
      # `tooling/test-matrix.json`. Thiếu một chỗ là test lại thành trang trí.
      - name: node --test (script test dùng node:test)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node --test scripts/__tests__/apply-reviewed-migration-authorization.test.mjs \
          scripts/__tests__/apply-reviewed-migration-transaction.test.mjs \
          scripts/__tests__/backup-luu-tru.test.mjs \
          scripts/__tests__/check-agent-contract.test.mjs \
          scripts/__tests__/check-external-controls.test.mjs \
          scripts/__tests__/check-graph-governance.test.mjs \
          scripts/__tests__/check-migration-provenance.test.mjs \
          scripts/__tests__/check-no-auto-apply.test.mjs \
          scripts/__tests__/check-copilot-routes.test.mjs \
          scripts/__tests__/check-copilot-tool-inventory.test.mjs \
          scripts/__tests__/check-dependency-audit.test.mjs \

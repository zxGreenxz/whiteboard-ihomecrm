    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'reconcile-money')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        env:
          SUPABASE_PAT: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_PAT || '' }}
          SUPABASE_TEST_EMAIL: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_TEST_EMAIL || '' }}
          SUPABASE_TEST_PASSWORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_TEST_PASSWORD || '' }}
        run: node scripts/ci-run-gates.mjs --job reconcile-money
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-reconcile-money-attempt-${{ github.run_attempt }}
          path: .gate-evidence/reconcile-money/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  cross-tenant-isolation:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'cross-tenant-isolation')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        env:
          SUPABASE_PAT: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_PAT || '' }}
        run: node scripts/ci-run-gates.mjs --job cross-tenant-isolation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-cross-tenant-isolation-attempt-${{ github.run_attempt }}
          path: .gate-evidence/cross-tenant-isolation/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  secret-scan:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'secret-scan')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci
      - name: Install pinned gitleaks with checksum
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Execute selected gates and write receipts
        run: node scripts/ci-run-gates.mjs --job secret-scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-secret-scan-attempt-${{ github.run_attempt }}
          path: .gate-evidence/secret-scan/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  realtime-gates:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'realtime-gates')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        env:
          SUPABASE_PAT: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_PAT || '' }}
        run: node scripts/ci-run-gates.mjs --job realtime-gates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-realtime-gates-attempt-${{ github.run_attempt }}
          path: .gate-evidence/realtime-gates/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  gate-aggregate:
    if: always() && github.ref != 'refs/heads/production'
    needs: [preflight, quality-gates, vitest-tests, strict-islands-gate, timezone-gate, security-gates, generated-types-drift, reconcile-money, cross-tenant-isolation, secret-scan, realtime-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # Aggregation imports only Node builtins (pinned by check-workflow-paths test): no npm ci.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Download plan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - name: Download current attempt receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern "gate-receipts-*-attempt-$GITHUB_RUN_ATTEMPT" --dir .gate-receipts
      - name: Aggregate required evidence
        if: always()
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-aggregate-gates.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-aggregate-attempt-${{ github.run_attempt }}
          path: .gate-evidence/aggregate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  production-promotion:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lấy về cả main để so
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Mọi commit đang phát hành đều đã qua main
        run: node scripts/check-production-promotion.mjs

      - name: Kết luận gate của commit đang phát hành
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/promote-to-production.mjs --sha "${{ github.sha }}" --wait-seconds 420

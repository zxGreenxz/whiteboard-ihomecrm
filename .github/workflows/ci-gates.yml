# CI Gates — bật tự động các cổng kiểm chất lượng/bảo mật hiện chỉ chạy TAY
# (P1 từ đợt tổng kiểm authorization). Không sửa/tạo gì khác ngoài file này.
#
# Job "quality-gates" là bắt buộc, chạy trên mọi PR/push KHÔNG cần secret nào
# (typecheck/lint/build/vitest) và KHÔNG dùng continue-on-error — lệnh fail thì
# job fail. Nhờ vậy CI XANH ngay khi merge file này, không đỏ vì thiếu secret.
#
# Các gate cần Supabase PAT / Management API / tài khoản test được tách RIÊNG,
# chỉ chạy trên refs/heads/main qua push hoặc workflow_dispatch, và chỉ khi
# maintainer đã cấu hình secret. PR và release/* chỉ chạy các gate không secret.
# Job "preflight" đọc secret ra output cho các job optional `needs: preflight`.
#
# Secrets cần cấu hình (Settings → Secrets and variables → Actions):
#   - SUPABASE_PAT            : Supabase Management API personal access token
#                                → BẬT "security-gates" (definer-acl, view-invoker)
#                                + cross-tenant-isolation + (cùng test creds) reconcile.
#   - SUPABASE_ACCESS_TOKEN   : access token cho Supabase CLI (job gen:types drift —
#                                cùng cơ chế .github/workflows/supabase-migrate.yml).
#   - SUPABASE_TEST_EMAIL / SUPABASE_TEST_PASSWORD : tài khoản test (JWT thật, RLS)
#                                dùng cho reconcile-money (nguồn B/C).
#
# GỢI Ý: thêm SUPABASE_PAT sớm để 2 gate ACL/view-invoker (chống drift quyền anon
# + lộ view xuyên-tenant) có hiệu lực trên push/manual của refs/heads/main.

name: CI Gates

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      # `production` là nhánh Vercel phát hành. Trước đây nó KHÔNG được theo dõi,
      # nên một push thẳng vào đó không kích hoạt gate nào — đúng nhánh nguy hiểm
      # nhất lại là nhánh duy nhất không ai canh.
      - production
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Preflight: kiểm secret nào đã cấu hình, xuất ra output cho các job optional.
  # (Không thể dùng secrets.* trong `if:` cấp job → phải qua bước này.)
  # ─────────────────────────────────────────────────────────────────────────
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pat: ${{ steps.check.outputs.has_pat }}
      has_cli_token: ${{ steps.check.outputs.has_cli_token }}
      has_test_creds: ${{ steps.check.outputs.has_test_creds }}
    steps:
      - id: check
        env:
          PAT: ${{ secrets.SUPABASE_PAT }}
          CLI: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TE: ${{ secrets.SUPABASE_TEST_EMAIL }}
          TP: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: |
          echo "has_pat=$([ -n "$PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_cli_token=$([ -n "$CLI" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_test_creds=$([ -n "$PAT" ] && [ -n "$TE" ] && [ -n "$TP" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Gate bắt buộc (KHÔNG cần secret): typecheck, lint, build, test.
  # Luôn chạy, xanh được ngay — không phụ thuộc PAT.
  # ─────────────────────────────────────────────────────────────────────────
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # fetch-depth: 0 — checkout mặc định là SHALLOW (chỉ 1 commit).
          # check-graph-hygiene.mjs phải duyệt lịch sử các commit đụng .ua/ để
          # cưỡng chế luật "refresh graph đi PR riêng" (Contract §12 luật #6), và
          # check-graph-freshness.mjs đo độ lệch từ baseCommit của graph. Với
          # repo nông, cả hai thoát 3 ("không kiểm được ≠ đạt") thay vì im lặng
          # cho qua — nhưng như vậy thì gate không bao giờ thật sự chạy trên CI.
          fetch-depth: 0

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (npm ci — khớp package-lock.json)
        run: npm ci

      - name: OpenClaw isolation boundary
        run: node scripts/check-openclaw-isolation.mjs

      # BA NHÓM GATE TĨNH theo plan §31 — nhưng là ba STEP, không phải ba JOB.
      #
      # Plan §0.6 muốn gộp 8 job thành 3 để "giảm bề mặt bảo trì và số nơi có thể
      # kẹt merge". Repo đi xa hơn: gộp về MỘT job. Tinh thần đã đạt, chỉ thiếu
      # phần đặt tên — mà tên job chỉ có giá trị khi bật được required check, và
      # điều đó bất khả ở tier hiện tại (repo private trên GitHub Free — đo ở
      # docs/generated/external-controls.json).
      #
      # Chia thành ba step CÓ TÊN thì được đúng phần giá trị còn lại mà không tốn
      # gì: giao diện PR chỉ ra ngay NHÓM nào đỏ, thay vì một khối 19 lệnh mà
      # phải mở log mới biết cái nào. Ba runner khởi động thì không.
      #
      # Việc cố ý KHÔNG tách thành job riêng đã đăng ký ở tooling/known-gaps.yaml
      # (ci-gates-mot-job-thay-vi-ba) — để deliverable không treo lơ lửng.

      - name: contract-gates (luật agent · bề mặt sản phẩm · runtime pin · known-gap hết hạn)
        run: |
          node scripts/check-agent-contract.mjs
          node scripts/check-runtime-matrix.mjs
          node scripts/check-known-gaps.mjs
          node scripts/check-capability-surfaces.mjs
          node scripts/check-route-guards.mjs
          node scripts/check-test-matrix.mjs
          node scripts/check-workflow-paths.mjs
          node scripts/check-raw-rpc-callers.mjs
          node scripts/check-realtime-query-keys.mjs
          node scripts/check-test-only-exports.mjs
          node scripts/check-unknown-review.mjs
          node scripts/check-ts-suppressions.mjs
          node scripts/check-rpc-cast-ratchet.mjs
          node scripts/check-rpc-in-view-ratchet.mjs
          node scripts/check-error-swallow-ratchet.mjs

      - name: schema-gates (provenance migration · canonical types · đường ghi production)
        run: |
          node scripts/check-migration-provenance.mjs
          node scripts/normalize-supabase-types.mjs --check
          node scripts/check-no-auto-apply.mjs
          node scripts/check-management-api-writes.mjs
          node scripts/check-promote-readiness.mjs
          node scripts/check-migration-test-liveness.mjs

      - name: docs-freshness (Copilot manifest · số đếm tài liệu · vệ sinh graph)
        run: |
          node scripts/check-copilot-docs-manifest.mjs
          node scripts/check-doc-counts.mjs
          node scripts/check-doc-freshness.mjs
          node scripts/generate-docs-views.mjs --check
          node scripts/check-graph-hygiene.mjs

      # Tách khỏi "Contract gates" vì bước này gọi tsc HAI lượt (--showConfig +
      # biên dịch 247 file), tốn hàng chục giây — trong khi cả khối trên chạy dưới
      # một giây. Gộp vào sẽ làm mất tín hiệu "khối gate tĩnh nhanh".
      - name: Đảo strict — vùng đã sạch không được bẩn lại
        run: node scripts/check-strict-islands.mjs

      # Chặn NỢ MỚI — khác gate trên, vốn canh nợ CŨ không bẩn lại.
      # Cần lịch sử git (diff với merge-base), nên job này phải checkout fetch-depth: 0.
      - name: Module mới phải strict ngay từ đầu
        run: node scripts/check-new-modules-strict.mjs

      # BAO CAO, khong phai cua chan: in tier rui ro + gate bat buoc cua PR nay.
      # No KHONG kiem duoc ban da chay cac gate do hay chua — khong co dau vet nao
      # trong repo de doc. Muc dich la de nguoi review thay ngay minh dang nhin gi.
      - name: Phan loai rui ro thay doi (bao cao)
        run: node scripts/check-risk-classifier.mjs

      # Độ mới graph — CỐ Ý KHÔNG CHẶN. Plan kiến trúc (dòng 119, 2271) đã chốt
      # UA freshness không phải required check: graph 4 MB commit vào repo, refresh
      # là cả một PR, nên đỏ CI mỗi khi nó cũ sẽ khiến người ta tắt gate đi. Chế độ
      # mặc định (không cờ --nhiem-vu) in đủ số đo rồi thoát 0 khi graph cũ; nó CHỈ
      # đỏ khi artifact hỏng hoặc không tự nhất quán — tức "không kết luận được".
      # Cửa chặn cứng nằm ở máy dev, theo nhiệm vụ (xem Contract §12 luật #1, #2).
      - name: Graph freshness (báo cáo — chỉ đỏ khi artifact hỏng)
        run: node scripts/check-graph-freshness.mjs

      - name: Typecheck baseline (gate chính — chặn lỗi TS MỚI so với ts-baseline.json)
        run: npm run typecheck:baseline

      # Đổi tên từ "Typecheck strict app": tsconfig.app.json đang strict:false,
      # nên tên cũ làm người đọc tưởng strict đã xong. Required check của GitHub
      # bám theo tên JOB (quality-gates), không phải tên step, nên đổi tên step
      # không phá cấu hình bảo vệ nhánh.
      - name: Typecheck app (tsconfig.app.json — CHƯA strict, xem ts-baseline.json)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint root-owned code
        run: >
          npm run lint --
          --ignore-pattern 'services/**'
          --ignore-pattern 'infra/**'
          --ignore-pattern 'supabase/functions/**'
          --ignore-pattern '.tmp-openclaw-host/**'
          --ignore-pattern '.e2e-fleet/**'

      - name: Build (vite build — bắt lỗi build-time không lộ ở tsc/eslint)
        run: npm run build

      # Keep root discovery inside root-owned suites. Node-only packages run in
      # openclaw-package-gates, so Bridge node:sqlite tests are never collected here.
      # scripts/__tests__/network-center-*.test.mjs dùng API `node:test`, KHÔNG
      # phải Vitest. Chúng do `node --test` chạy trong workflow network-center.
      # Để Vitest quét thì cả 22 file fail với "No test suite found in file" —
      # đo được 06/08/2026. Job này khi đó đỏ vì lý do chẳng liên quan gì tới
      # chất lượng code, và một CI đỏ thường trực là thứ khiến người ta ngừng
      # đọc kết quả CI.
      - name: Vitest (root-owned app and script suites)
        run: >
          npx vitest run src scripts/__tests__
          --exclude 'services/**'
          --exclude 'infra/**'
          --exclude '.tmp-openclaw-host/**'
          --exclude '.e2e-fleet/**'
          --exclude 'scripts/__tests__/network-center-*.test.mjs'
          --exclude 'src/lib/__tests__/openclawZaloMigrations.test.ts'
          --exclude 'scripts/__tests__/openclaw-sql-harness.test.mjs'
          --exclude 'scripts/__tests__/openclaw-concurrency-harness.test.mjs'
          --exclude 'scripts/__tests__/openclaw-browser-dml-matrix.test.mjs'
          --exclude 'scripts/__tests__/openclaw-composite-fk-indexes.test.mjs'
          --exclude 'scripts/__tests__/openclaw-schema-drift-harness.test.mjs'
          --exclude 'scripts/__tests__/openclaw-full-reset-harness.test.mjs'

      # Runner này chạy UTC còn dữ liệu và người dùng ở UTC+7, nên một lỗi ngày
      # tháng có thể XANH ở đây và SAI trên máy người dùng — hoặc ngược lại. Bước
      # này chạy lại nhóm src/lib + src/hooks dưới 4 múi giờ (UTC-11 → UTC+14) và
      # đòi kết quả GIỐNG HỆT.
      # Nó đã chứng minh giá trị ngay lần chạy đầu: bắt được useOccupancyTrend12m
      # đưa chuỗi chỉ-có-ngày qua `new Date()` rồi đọc bằng getMonth() — biểu đồ
      # lấp đầy lệch một tháng ở mọi múi giờ âm. Cả 2810 test đều xanh ở UTC lẫn
      # UTC+7 nên không cách nào thấy nếu không thử ở múi giờ âm.
      # ~48 giây (4 lượt × 12s) nên KHÔNG gộp vào bước "Contract gates" vốn dành
      # cho các kiểm tra dưới một giây.
      - name: Ổn định múi giờ (chạy lại test ngày/tiền ở UTC-11 → UTC+14)
        run: npm run gate:timezone

  openclaw-edge-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gates
    env:
      DENO_NO_PACKAGE_JSON: '1'
      DENO_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Install root dependencies
        run: npm ci

      - name: Setup Deno 2.9.4
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.4

      - name: Vitest (bounded OpenClaw Edge scopes)
        run: >
          npx vitest run
          supabase/functions/_shared/openclaw
          supabase/functions/openclaw-control
          supabase/functions/openclaw-qr
          supabase/functions/openclaw-runtime-token
          supabase/functions/openclaw-runtime
          supabase/functions/openclaw-object-tickets

      - name: Deno cache production entrypoints
        run: |
          deno cache --frozen --lock=deno.lock \
            supabase/functions/openclaw-control/index.ts \
            supabase/functions/openclaw-qr/index.ts \
            supabase/functions/openclaw-runtime-token/index.ts \
            supabase/functions/openclaw-runtime/index.ts \
            supabase/functions/openclaw-object-tickets/index.ts \
            supabase/functions/_shared/openclaw/deps.ts

      - name: Deno lint bounded Edge scopes
        run: |
          deno cache --frozen --lock=deno.lock \
            supabase/functions/openclaw-control/index.ts \
            supabase/functions/openclaw-qr/index.ts \
            supabase/functions/openclaw-runtime-token/index.ts \
            supabase/functions/openclaw-runtime/index.ts \
            supabase/functions/openclaw-object-tickets/index.ts \
            supabase/functions/_shared/openclaw/deps.ts
          deno lint \
            supabase/functions/openclaw-control \
            supabase/functions/openclaw-qr \
            supabase/functions/openclaw-runtime-token \
            supabase/functions/openclaw-runtime \
            supabase/functions/openclaw-object-tickets \
            supabase/functions/_shared/openclaw

      - name: Deno check production entrypoints
        run: |
          deno check --frozen --lock=deno.lock \
            supabase/functions/openclaw-control/index.ts \
            supabase/functions/openclaw-qr/index.ts \
            supabase/functions/openclaw-runtime-token/index.ts \
            supabase/functions/openclaw-runtime/index.ts \
            supabase/functions/openclaw-object-tickets/index.ts

  openclaw-sql-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Install root dependencies
        run: npm ci

      - name: OpenClaw canonical local SQL gates
        run: npm run test:openclaw:sql

  generated-types-local-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Install root dependencies
        run: npm ci

      - name: Deterministic local generated-types drift
        env:
          SUPABASE_TYPES_SOURCE: local
          SUPABASE_TYPES_LOCAL_ENGINE: pglite
        run: |
          npm run gen:types
          git diff --exit-code -- src/integrations/supabase/types.ts

  openclaw-package-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gates
    strategy:
      fail-fast: false
      matrix:
        package:
          - services/openclaw-zalo-bridge
          - services/openclaw-zalo-maintenance
          - infra/openclaw-media-gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Install package dependencies
        run: npm --prefix "${{ matrix.package }}" ci

      - name: Build package
        run: npm --prefix "${{ matrix.package }}" run build

      - name: Typecheck package
        run: npm --prefix "${{ matrix.package }}" run typecheck

      - name: Test package
        run: npm --prefix "${{ matrix.package }}" run test

      - name: Lint package when defined
        run: npm --prefix "${{ matrix.package }}" run lint --if-present

  openclaw-session-crypto-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: services/openclaw-zalo-cell/session-crypto/package-lock.json

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Install session-crypto dependencies
        run: npm --prefix services/openclaw-zalo-cell/session-crypto ci

      # verify:dist compares the committed three-file runtime closure with two
      # independent clean builds before any later step can overwrite it.
      - name: Verify deterministic session-crypto dist
        run: npm --prefix services/openclaw-zalo-cell/session-crypto run verify:dist

      - name: Test session-crypto
        run: npm --prefix services/openclaw-zalo-cell/session-crypto run test

      - name: Typecheck session-crypto
        run: npm --prefix services/openclaw-zalo-cell/session-crypto run typecheck

      - name: Lint session-crypto when defined
        run: npm --prefix services/openclaw-zalo-cell/session-crypto run lint --if-present

  openclaw-vendor-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: services/openclaw-zalo-cell/vendor/zalouser-bridge/package-lock.json

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Provision exact vendor npm
        run: npm install --global npm@11.12.1

      - name: Run dependency-free vendor preflight
        run: |
          test "$(npm --version)" = "11.12.1"
          npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run preflight

      - name: Install vendor harness dependencies
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge ci

      - name: Verify reviewed upstream provenance
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run verify:upstream

      - name: Prepare verified vendor source
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run vendor:prepare

      - name: Typecheck vendor harness
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run typecheck

      - name: Test vendor harness
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run test

      - name: Build vendor artifact
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run build

      - name: Pack vendor artifact
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run pack

      - name: Verify vendor artifact
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run verify:artifact

      - name: Lint vendor harness when defined
        run: npm --prefix services/openclaw-zalo-cell/vendor/zalouser-bridge run lint --if-present

  openclaw-cell-image-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - openclaw-session-crypto-gate
      - openclaw-vendor-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Verify source-only cell image contracts
        run: node --test services/openclaw-zalo-cell/test/image-contract.test.mjs

  openclaw-docker-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: openclaw-package-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bridge
            context: services/openclaw-zalo-bridge
            dockerfile: services/openclaw-zalo-bridge/Dockerfile
          - service: maintenance
            context: services/openclaw-zalo-maintenance
            dockerfile: services/openclaw-zalo-maintenance/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build ${{ matrix.service }} image without publishing
        run: docker build --file "${{ matrix.dockerfile }}" --tag "openclaw-${{ matrix.service }}:ci" "${{ matrix.context }}"

  # ─────────────────────────────────────────────────────────────────────────
  # Gate BẢO MẬT (cần SUPABASE_PAT): definer-acl + view-invoker gọi Management
  # API. Chỉ chạy trên push/manual refs/heads/main; PR và release/* không nhận secret.
  # ─────────────────────────────────────────────────────────────────────────
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_pat == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency
        run: npm ci

      # Gate ACL (AUTHORIZATION-PLAN §9.3 điểm 9): chặn SECURITY DEFINER function
      # mới anon-executable ngoài allowlist baseline (chống drift quyền anon).
      - name: Definer ACL drift (SECURITY DEFINER anon-executable)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-definer-acl.mjs

      # Gate view: mọi VIEW public phải security_invoker=true — án lệ
      # CREATE OR REPLACE VIEW làm rớt cờ này, lộ dữ liệu tenant khác.
      - name: View security_invoker (chống lộ dữ liệu xuyên tenant qua view)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-view-invoker.mjs

      # Gate provenance (AUTHORIZATION-PLAN §20-10): phiếu APPROVED thiếu
      # approver mà cũng thiếu system_source = có writer legacy sống lại ngoài
      # đường canonical. Bắt regress thay vì để số liệu audit trôi âm thầm.
      - name: Approver provenance (chống writer legacy tạo phiếu tự-duyệt)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-approver-provenance.mjs

      # Khoá quyền có trong DB mà FE không có nhãn = quyền VÔ HÌNH: không ai
      # cấp/thu hồi được từ bảng phân quyền. Ngày 26/07 đã đo lệch đúng 11 khoá.
      # Chiều ngược lại (nhãn trỏ khoá không có) thì tick vào là bị RPC từ chối.
      - name: Catalog quyền FE khớp permission_definitions
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-permission-catalog.mjs

      # Bảng hub realtime lắng nghe mà KHÔNG nằm trong publication
      # `supabase_realtime` = subscribe câm: Supabase không đẩy sự kiện nào,
      # không lỗi, không cảnh báo, giao diện chỉ lặng lẽ ngừng tự cập nhật.
      # Án lệ: contract_terminations/contract_transfers từng vắng ở cả hai nơi.
      - name: Bảng realtime hub lắng nghe đều được publish
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-realtime-descriptors.mjs

      # Ledger supabase_migrations phải ĐỨNG YÊN: forward-only lane cố ý không
      # backfill nó, nên mọi thay đổi nghĩa là ai đó đã dùng đường khác. Quan
      # trọng vì migration-provenance.json xếp 351 file là `ledger-applied` DỰA
      # TRÊN bảng này — viết lại bảng thì 351 khẳng định xuất xứ mất căn cứ mà
      # không có lỗi nào phát ra.
      - name: Sổ ledger migration không bị viết lại
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-migration-ledger-frozen.mjs

      # Migration sau cutoff phải chạy lại được lần hai. Re-apply xảy ra khi apply
      # hỏng giữa chừng, khi dựng lại môi trường từ baseline + forward lane, và khi
      # hợp thức hoá một thay đổi đã đi đường tắt — cả ba đều là lúc người ta vội.
      # Chạy trên production nhưng KHÔNG ghi: hai lượt trong một transaction, ROLLBACK.
      - name: Migration forward chạy lại được lần hai (idempotent)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-forward-migration-idempotent.mjs

      # BA BIÊN mà hợp đồng chỉ là MỘT CHUỖI, và không trình biên dịch nào kiểm
      # được: tên RPC, slug Edge Function, tên bảng realtime. types.ts có kiểu RPC
      # nhưng chỉ che phần src/ được tsc soi — Edge Function chạy Deno, services/
      # và infra/ nằm ngoài hoàn toàn. Manifest sinh từ HAI nguồn (call site +
      # catalog live) theo plan §P1.7, và đỏ khi hai nguồn không giao nhau đúng.
      - name: Bề mặt RPC · Edge · realtime khớp catalog live
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          node scripts/check-rpc-surface.mjs
          node scripts/check-edge-surface.mjs
          node scripts/check-realtime-surface.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Optional: phát hiện types.ts (Supabase generated types) trôi so với schema.
  # Cần SUPABASE_ACCESS_TOKEN (Supabase CLI).
  # ─────────────────────────────────────────────────────────────────────────
  generated-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_cli_token == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency
        run: npm ci

      - name: Gen types từ DB thật rồi so với src/integrations/supabase/types.ts đã commit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # scripts/gen-supabase-types.mjs GHI THẲNG vào src/integrations/supabase/types.ts
          # (outputPath hardcode ở :192) và TỰ chèn header (:9/:79). stdout chỉ có banner npm.
          # Bản cũ `npm run gen:types > /tmp/x.ts` hỏng cả hai vế: vế phải là banner, vế trái
          # đã bị script ghi đè trước khi diff chạy ⇒ job luôn exit 1. Phải sao lưu trước.
          cp src/integrations/supabase/types.ts /tmp/types.committed.ts
          npm run gen:types
          diff -u /tmp/types.committed.ts src/integrations/supabase/types.ts \
            && echo "✅ types.ts khớp schema DB — không trôi." \
            || { echo "❌ types.ts TRÔI so với schema thật — chạy: npm run gen:types (script tự ghi + tự thêm header, KHÔNG redirect)"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────
  # Optional: đối chiếu tiền 3 nguồn độc lập (bug class cap-1000 PostgREST).
  # Cần SUPABASE_PAT + tài khoản test thật (JWT/RLS).
  # ─────────────────────────────────────────────────────────────────────────
  reconcile-money:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_test_creds == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (cần @supabase/supabase-js)
        run: npm ci

      # VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY đọc từ file .env đã
      # commit trong repo (anon key công khai theo thiết kế) — không cần secret.
      - name: Đối chiếu tiền — 3 nguồn độc lập (SQL SUM / RPC RLS / phân trang FE)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: node scripts/reconcile-money.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Optional: ma trận âm bản cách ly tenant (integration test chống rò rỉ
  # xuyên-tenant). Cần SUPABASE_PAT. Thao tác trong BEGIN…ROLLBACK.
  # ─────────────────────────────────────────────────────────────────────────
  cross-tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_pat == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Ma trận âm bản cách ly tenant (OWNER/ADMIN/FULL-SCOPE staff)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/test-cross-tenant.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Quét secret TOÀN LỊCH SỬ.
  #
  # Đợt 0a #3 của plan đòi việc này. Nó ĐÃ được chạy một lần (số liệu ghi ở
  # tooling/program-status.json) nhưng không để lại artifact và không có cơ chế
  # chạy lại — tức là một lần kiểm, không phải một cửa chặn. Bằng chứng chứng
  # minh nó SẠCH LÚC ĐÓ không chứng minh nó SẠCH BÂY GIỜ; đây đúng là kiểu hỏng
  # đã cắn hai lần trong ngày 07/08 (backup đứt âm thầm, baseline chưa từng
  # restore thật).
  #
  # Cài binary pin theo VERSION + SHA256 thay vì dùng gitleaks-action: action v2
  # đòi GITLEAKS_LICENSE cho tổ chức, và một cửa chặn phụ thuộc giấy phép bên thứ
  # ba là một cửa chặn sẽ tắt vào ngày không ai muốn.
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # BẮT BUỘC: quét toàn lịch sử. Checkout nông chỉ thấy một commit, và
          # gitleaks sẽ báo "no leaks found" — xanh rỗng, đúng thứ tệ nhất.
          fetch-depth: 0
          persist-credentials: false

      - name: Cài gitleaks (pin version + sha256)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Chốt chặn xanh-rỗng — phải thật sự có lịch sử để quét
        run: |
          set -euo pipefail
          COMMITS=$(git rev-list --count HEAD)
          echo "Lịch sử: $COMMITS commit"
          if [ "$COMMITS" -lt 500 ]; then
            echo "::error::Chỉ thấy $COMMITS commit (sàn 500). Checkout nông ⇒ 'no leaks found' là vô nghĩa."
            exit 1
          fi

      - name: Quét toàn lịch sử
        run: /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .

      # Artifact graph là một loại rủi ro RIÊNG, không nằm trong bước trên.
      #
      # `gitleaks git` quét COMMIT. Nó bắt secret bị commit — nhưng
      # .ua/knowledge-graph.json là 8 MB văn bản do LLM sinh ra sau khi đọc toàn
      # repo (kể cả fixture, seed, migration có dữ liệu mẫu), rồi được commit và
      # push công khai. Hai thứ gitleaks KHÔNG bắt:
      #   - PII khách hàng (số điện thoại, email) — không có luật nào cho nó
      #   - và diff 8 MB JSON thì không ai review bằng mắt để bù lại
      # Đo thật 08/08/2026: gitleaks trả "no leaks found" trên .ua/, trong khi
      # cần một phép kiểm riêng cho trường văn bản. Đặt ở job này vì binary
      # gitleaks đã có sẵn — tải lần nữa ở job khác là lãng phí và dễ lệch version.
      - name: Secret + PII trên artifact graph (.ua/)
        env:
          GITLEAKS_BIN: /tmp/gitleaks
        run: node scripts/check-graph-secrets.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Nhánh `production` là thứ Vercel phát hành. Push thẳng vào đó = phát hành mã
  # chưa từng qua CI của main. Branch protection KHÔNG bật được (repo private
  # trên GitHub Free — đo ở docs/generated/external-controls.json), nên cửa chặn
  # khả thi duy nhất là kêu SAU push. Kêu sau vẫn hơn không biết.
  # ─────────────────────────────────────────────────────────────────────────
  production-promotion:
    if: github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lấy về cả main để so
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Mọi commit đang phát hành đều đã qua main
        run: node scripts/check-production-promotion.mjs

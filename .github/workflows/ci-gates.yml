# Main/PR: kiểm chất lượng; gate có credential chỉ chạy trên main.
# Production: xác minh bằng chứng CI của đúng SHA sau push. Promote qua script trước khi push.

name: CI Gates

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - production
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_pat: ${{ steps.check.outputs.has_pat }}
      has_cli_token: ${{ steps.check.outputs.has_cli_token }}
      has_test_creds: ${{ steps.check.outputs.has_test_creds }}
    steps:
      - id: check
        env:
          PAT: ${{ secrets.SUPABASE_PAT }}
          CLI: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TE: ${{ secrets.SUPABASE_TEST_EMAIL }}
          TP: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: |
          echo "has_pat=$([ -n "$PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_cli_token=$([ -n "$CLI" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_test_creds=$([ -n "$PAT" ] && [ -n "$TE" ] && [ -n "$TP" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  quality-gates:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/production'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (npm ci — khớp package-lock.json)
        id: caidat
        run: npm ci

      - name: Organization backup envelope regressions (no credentials)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node --test scripts/org-context-repair/sealed-artifact.test.mjs

      - name: contract-gates (luật agent · bề mặt sản phẩm · runtime pin · known-gap hết hạn)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          loi=0
          node scripts/check-agent-contract.mjs || loi=1
          node scripts/check-runtime-matrix.mjs || loi=1
          node scripts/check-known-gaps.mjs || loi=1
          node scripts/check-capability-surfaces.mjs || loi=1
          node scripts/check-route-permission-drift.mjs || loi=1
          node scripts/check-capability-docs.mjs || loi=1
          node scripts/check-baseline-doc.mjs || loi=1
          node scripts/check-route-guards.mjs || loi=1
          node scripts/check-test-matrix.mjs || loi=1
          node scripts/check-workflow-paths.mjs || loi=1
          node scripts/check-raw-rpc-callers.mjs || loi=1
          node scripts/check-realtime-query-keys.mjs || loi=1
          node scripts/check-evidence-store.mjs || loi=1
          node scripts/check-test-only-exports.mjs || loi=1
          node scripts/check-unknown-review.mjs || loi=1
          node scripts/check-ts-suppressions.mjs || loi=1
          node scripts/check-rpc-cast-ratchet.mjs || loi=1
          node scripts/check-rpc-in-view-ratchet.mjs || loi=1
          node scripts/check-error-swallow-ratchet.mjs || loi=1
          node scripts/check-money-table-dml.mjs || loi=1
          exit $loi

      - name: schema-gates (provenance migration · canonical types · đường ghi production)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          loi=0
          node scripts/check-migration-provenance.mjs || loi=1
          node scripts/normalize-supabase-types.mjs --check || loi=1
          node scripts/check-no-auto-apply.mjs || loi=1
          node scripts/check-management-api-writes.mjs || loi=1
          node scripts/check-promote-readiness.mjs || loi=1
          node scripts/check-migration-test-liveness.mjs || loi=1
          exit $loi

      - name: Lỗ hổng phụ thuộc — phân tầng theo tầm với, mỗi mục có hạn ký nhận
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-dependency-audit.mjs

      - name: docs-freshness (Copilot manifest · số đếm tài liệu)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          loi=0
          node scripts/check-copilot-docs-manifest.mjs || loi=1
          # Whitelist ĐIỀU HƯỚNG của Copilot: route sai ⇒ nó báo "✅ Đã mở trang"
          # rồi đưa người dùng tới màn trắng; module quyền sai ⇒ nó báo "không có
          # quyền" cho người ĐANG có quyền. Cả hai đều là chuỗi, tsc không bắt được.
          node scripts/check-copilot-routes.mjs || loi=1
          # NỐI 26/08/2026 — nghịch lý cũ: TEST của gate này chạy trong CI (bước
          # node --test) mà chính gate thì chưa từng chạy ở đâu. Gate tĩnh, <1s.
          node scripts/check-copilot-tool-inventory.mjs || loi=1
          node scripts/check-doc-counts.mjs || loi=1
          node scripts/check-doc-freshness.mjs || loi=1
          node scripts/generate-docs-views.mjs --check || loi=1
          exit $loi

      - name: copilot-gates (ranh giới L5/L6 · hợp đồng trang · điều khiển an toàn · provider · E2E · golden eval · negative-proofs)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          loi=0
          # Copilot chỉ được nói về trang mà nó thật sự biết đường tới.
          node scripts/check-copilot-page-contracts.mjs || loi=1
          # Marker khai nút nào Copilot được phép bấm hộ người dùng.
          node scripts/check-copilot-safe-control-markers.mjs || loi=1
          # Giá + phân lớp dữ liệu từng provider; provider bật mà pricing "unknown" là đỏ.
          node scripts/check-copilot-provider-policy.mjs || loi=1
          # 5 spec E2E bắt buộc phải TỒN TẠI — copilot-e2e.yml là nơi chạy chúng.
          node scripts/check-copilot-e2e-files.mjs || loi=1
          # Bộ 30 ca vàng: đúng C01–C30, mỗi ca có oracle, SLA khai tường minh.
          node scripts/check-copilot-golden-eval.mjs || loi=1
          # Ranh giới L5/L6, đọc từ tooling/copilot-action-policy.json.
          node scripts/check-copilot-forbidden-actions.mjs || loi=1
          # Corpus hướng dẫn: đối số `import.meta.glob` phải khớp allowlist
          # CAPABILITIES từng dòng. Glob rộng gom NỘI DUNG trang ngoài allowlist
          # (admin-users, phan-quyen, roadmap) vào chunk JS công khai trên CDN —
          # allowlist chặn TÌM, chỉ đối số này chặn PHÂN PHỐI (án lệ I5, 03/09/2026).
          node scripts/generate-copilot-guide-corpus.mjs --check || loi=1
          # G4 (03/09/2026): artifact live negative-proofs (wrong-org, cờ bị thu
          # hồi giữa preview/execute, nonce replay, digest sai, 2 execute đồng
          # thời, plan cancel) còn tươi (≤14 ngày) và mọi ca pass. Gate CHỈ đọc
          # docs/generated/copilot-negative-proofs/<sha>.json đã commit — không
          # tự chạy scripts/copilot-live-negative-proofs.mjs (cần JWT thật).
          node scripts/check-copilot-negative-proofs.mjs || loi=1
          exit $loi

      - name: Copilot golden eval — lane mock (báo cáo ra $RUNNER_TEMP)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        env:
          BAO_CAO: ${{ runner.temp }}/copilot-golden-eval-mock.json
          SHA: ${{ github.sha }}
        run: |
          node scripts/run-copilot-golden-eval.mjs \
            --lane mock \
            --build-sha "$SHA" \
            --provider-model mock-deterministic \
            --out "$BAO_CAO" > /dev/null || true
          node scripts/check-golden-eval-report.mjs "$BAO_CAO"

      - name: Tải lên báo cáo golden eval (lane mock)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: copilot-golden-eval-mock
          path: ${{ runner.temp }}/copilot-golden-eval-mock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cài Deno cho test Edge llm-proxy
        if: ${{ !cancelled() }}
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.9.4

      - name: Deno test — supabase/functions/llm-proxy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          deno test --config supabase/functions/llm-proxy/deno.json \
            supabase/functions/llm-proxy/index.test.ts --allow-env
      - name: Module mới phải strict ngay từ đầu
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-new-modules-strict.mjs

      - name: Phan loai rui ro thay doi (bao cao)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-risk-classifier.mjs

      - name: Typecheck baseline (gate chính — chặn lỗi TS MỚI so với ts-baseline.json)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: npm run typecheck:baseline

      - name: Lint root-owned code (ratchet — chặn lỗi MỚI, nợ cũ khai ở eslint-baseline.json)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: node scripts/check-eslint-baseline.mjs

      - name: Build (vite build — bắt lỗi build-time không lộ ở tsc/eslint)
        id: build
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: npm run build

      - name: Bundle không có hồi quy eager-import
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: node scripts/generate-bundle-inventory.mjs

      - name: node --test (script test dùng node:test)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: |
          node --test \
            scripts/__tests__/apply-reviewed-migration-authorization.test.mjs \
            scripts/__tests__/apply-reviewed-migration-transaction.test.mjs \
            scripts/__tests__/backup-luu-tru.test.mjs \
            scripts/__tests__/check-agent-contract.test.mjs \
            scripts/__tests__/check-external-controls.test.mjs \
            scripts/__tests__/check-golden-eval-report.test.mjs \
            scripts/__tests__/copilot-golden-browser-evidence.test.mjs \
            scripts/__tests__/copilot-g1-acceptance.test.mjs \
            scripts/__tests__/copilot-g1-guard.test.mjs \
            scripts/__tests__/copilot-remaining-reports.test.mjs \
            scripts/__tests__/copilot-g3-voucher-lifecycle.test.mjs \
            scripts/__tests__/copilot-g3-writer-admission.test.mjs \
            scripts/__tests__/copilot-c02-fixture-lifecycle.test.mjs \
            scripts/__tests__/copilot-golden-real-cli.test.mjs \
            scripts/__tests__/run-pinned-gitnexus.test.mjs \
            scripts/__tests__/check-migration-provenance.test.mjs \
            scripts/__tests__/check-no-auto-apply.test.mjs \
            scripts/__tests__/check-copilot-routes.test.mjs \
            scripts/__tests__/check-copilot-tool-inventory.test.mjs \
            scripts/__tests__/check-copilot-docs-manifest.test.mjs \
            scripts/__tests__/check-copilot-e2e-files.test.mjs \
            scripts/__tests__/check-copilot-forbidden-actions.test.mjs \
            scripts/__tests__/check-copilot-negative-proofs.test.mjs \
            scripts/__tests__/check-copilot-page-contracts.test.mjs \
            scripts/__tests__/check-copilot-provider-policy.test.mjs \
            scripts/__tests__/check-copilot-safe-control-markers.test.mjs \
            scripts/__tests__/copilot-ledger-audit.test.mjs \
            scripts/__tests__/copilot-ledger-audit-rpc.test.mjs \
            scripts/__tests__/copilot-ledger-replay-audit-id-migration.test.mjs \
            scripts/__tests__/copilot-l4-risk-ceiling-acceptance.test.mjs \
            scripts/__tests__/copilot-demo-deny-fixture.test.mjs \
            scripts/__tests__/copilot-room-pass-active.test.mjs \
            scripts/__tests__/copilot-room-pass-live-acceptance.test.mjs \
            scripts/__tests__/copilot-room-pass-resume.test.mjs \
            scripts/__tests__/copilot-room-pass-sessions.test.mjs \
            scripts/__tests__/check-csp-build-attestation.test.mjs \
            scripts/__tests__/run-copilot-golden-eval.test.mjs \
            scripts/__tests__/check-dependency-audit.test.mjs \
            scripts/__tests__/check-eslint-baseline.test.mjs \
            scripts/__tests__/check-realtime-key-ownership.test.mjs \
            scripts/__tests__/check-rpc-arg-names.test.mjs \
            scripts/__tests__/check-rpc-layer.test.mjs \
            scripts/__tests__/check-rpc-name-literal.test.mjs \
            scripts/__tests__/generate-bundle-inventory.test.mjs \
            scripts/__tests__/check-ts-suppressions.test.mjs \
            scripts/__tests__/check-ts-baseline.test.mjs

      - name: Vitest (root-owned app and script suites)
        if: ${{ !cancelled() && steps.caidat.conclusion == 'success' }}
        run: >
          npx vitest run src scripts/__tests__ worker/__tests__
          --exclude 'services/**'
          --exclude 'infra/**'
          --exclude '.e2e-fleet/**'
          --exclude 'scripts/__tests__/network-center-*.test.mjs'
          --exclude 'scripts/__tests__/apply-reviewed-migration-authorization.test.mjs'
          --exclude 'scripts/__tests__/apply-reviewed-migration-transaction.test.mjs'
          --exclude 'scripts/__tests__/backup-luu-tru.test.mjs'
          --exclude 'scripts/__tests__/check-agent-contract.test.mjs'
          --exclude 'scripts/__tests__/check-external-controls.test.mjs'
          --exclude 'scripts/__tests__/check-golden-eval-report.test.mjs'
          --exclude 'scripts/__tests__/copilot-golden-browser-evidence.test.mjs'
          --exclude 'scripts/__tests__/copilot-g1-acceptance.test.mjs'
          --exclude 'scripts/__tests__/copilot-g1-guard.test.mjs'
          --exclude 'scripts/__tests__/copilot-remaining-reports.test.mjs'
          --exclude 'scripts/__tests__/copilot-g3-voucher-lifecycle.test.mjs'
          --exclude 'scripts/__tests__/copilot-g3-writer-admission.test.mjs'
          --exclude 'scripts/__tests__/copilot-c02-fixture-lifecycle.test.mjs'
          --exclude 'scripts/__tests__/copilot-golden-real-cli.test.mjs'
          --exclude 'scripts/__tests__/run-pinned-gitnexus.test.mjs'
          --exclude 'scripts/__tests__/check-migration-provenance.test.mjs'
          --exclude 'scripts/__tests__/check-no-auto-apply.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-routes.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-tool-inventory.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-docs-manifest.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-e2e-files.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-forbidden-actions.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-negative-proofs.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-page-contracts.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-provider-policy.test.mjs'
          --exclude 'scripts/__tests__/check-copilot-safe-control-markers.test.mjs'
          --exclude 'scripts/__tests__/copilot-ledger-audit.test.mjs'
          --exclude 'scripts/__tests__/copilot-ledger-audit-rpc.test.mjs'
          --exclude 'scripts/__tests__/copilot-ledger-replay-audit-id-migration.test.mjs'
          --exclude 'scripts/__tests__/copilot-l4-risk-ceiling-acceptance.test.mjs'
          --exclude 'scripts/__tests__/copilot-demo-deny-fixture.test.mjs'
          --exclude 'scripts/__tests__/copilot-room-pass-active.test.mjs'
          --exclude 'scripts/__tests__/copilot-room-pass-live-acceptance.test.mjs'
          --exclude 'scripts/__tests__/copilot-room-pass-resume.test.mjs'
          --exclude 'scripts/__tests__/copilot-room-pass-sessions.test.mjs'
          --exclude 'scripts/__tests__/check-csp-build-attestation.test.mjs'
          --exclude 'scripts/__tests__/run-copilot-golden-eval.test.mjs'
          --exclude 'scripts/__tests__/check-dependency-audit.test.mjs'
          --exclude 'scripts/__tests__/check-eslint-baseline.test.mjs'
          --exclude 'scripts/__tests__/check-realtime-key-ownership.test.mjs'
          --exclude 'scripts/__tests__/check-rpc-arg-names.test.mjs'
          --exclude 'scripts/__tests__/check-rpc-layer.test.mjs'
          --exclude 'scripts/__tests__/check-rpc-name-literal.test.mjs'
          --exclude 'scripts/__tests__/generate-bundle-inventory.test.mjs'
          --exclude 'scripts/__tests__/check-ts-suppressions.test.mjs'
          --exclude 'scripts/__tests__/check-ts-baseline.test.mjs'

  strict-islands-gate:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (npm ci — khớp package-lock.json)
        run: npm ci

      - name: Đảo strict — vùng đã sạch không được bẩn lại
        run: node scripts/check-strict-islands.mjs

  timezone-gate:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency (npm ci — khớp package-lock.json)
        run: npm ci

      - name: Ổn định múi giờ (chạy lại test ngày/tiền ở UTC-11 → UTC+14)
        run: npm run gate:timezone

  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_pat == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency
        run: npm ci

      - name: Definer ACL drift (SECURITY DEFINER anon-executable)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-definer-acl.mjs

      - name: View security_invoker (chống lộ dữ liệu xuyên tenant qua view)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-view-invoker.mjs

      - name: Approver provenance (chống writer legacy tạo phiếu tự-duyệt)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-approver-provenance.mjs

      - name: Catalog quyền FE khớp permission_definitions
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-permission-catalog.mjs

      - name: Sổ ledger migration không bị viết lại
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-migration-ledger-frozen.mjs

      - name: Migration forward chạy lại được lần hai (idempotent)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-forward-migration-idempotent.mjs --tu-moc "${{ github.event.before }}"

      - name: Bề mặt RPC · Edge · realtime khớp catalog live
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          node scripts/check-rpc-surface.mjs
          node scripts/check-edge-surface.mjs
          node scripts/check-realtime-surface.mjs
          # Lớp sâu hơn ba cái trên: chúng canh RPC có TỒN TẠI, cái này canh TÊN
          # THAM SỐ. PostgREST phân giải hàm bằng tham số có tên, nên sai một tên
          # là cả lời gọi hỏng với PGRST202 "không tìm thấy hàm" — thông báo đó
          # dẫn người sửa đi tìm migration thiếu thay vì nhìn vào tên tham số.
          # Đọc manifest đã sinh, KHÔNG tự gọi mạng.
          node scripts/check-rpc-arg-names.mjs
          # KHOẢNG MÙ của chính ba gate trên: chúng tìm tên RPC bằng chuỗi viết
          # thẳng, nên lời gọi có tên đi qua biến thì cả ba đều không thấy. Gate
          # này đếm và khoá phần mù đó lại (đo 12/08/2026: 31/270 = 11,5%).
          node scripts/check-rpc-name-literal.mjs
          # Tầng: `supabase.rpc()` không được gọi thẳng trong component. Gom về
          # hook/lib thì hai gate trên có ít điểm phải soi hơn, và quyền sở hữu
          # query key nằm cùng chỗ với lời gọi.
          node scripts/check-rpc-layer.mjs
          # Tầng KEY của realtime: check-realtime-descriptors chặn ba nguồn ở tầng
          # BẢNG (publication ↔ hub ↔ descriptor), không gì chặn tầng key.
          # `invalidateQueries` khớp theo prefix và IM LẶNG khi không khớp ai.
          node scripts/check-realtime-key-ownership.mjs
          # NỐI VÀO CI 26/08/2026 — trước đó gate này MỒ CÔI: không workflow nào
          # gọi nó, trong khi CTE của nó bị CHÉP NGUYÊN VĂN vào
          # kiem-bao-mat-sau-khoi-phuc.mjs (chạy trong restore-drill). Bản gốc
          # không ai chạy thì hai bản sẽ trôi khỏi nhau trong im lặng — chạy nó
          # ở đây (job đã có PAT sẵn) là cách rẻ nhất giữ nguồn còn sống.
          node scripts/check-stable-fn-locks.mjs

      - name: Mọi bảng có organization_id đều có chỗ đứng
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/build-org-boundary-inventory.mjs --check

      - name: Không rò dữ liệu xuyên tổ chức (đo bằng vai người dùng thật)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/measure-org-leak.mjs

  generated-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_cli_token == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Verify exact stable Node runtime
        run: node -e "if(process.version!=='v24.18.0'){console.error('Expected exact stable Node v24.18.0, got '+process.version);process.exit(1)}"

      - name: Cài dependency
        run: npm ci

      - name: Gen types từ DB thật rồi so với src/integrations/supabase/types.ts đã commit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # scripts/gen-supabase-types.mjs GHI THẲNG vào src/integrations/supabase/types.ts
          # (outputPath hardcode ở :192) và TỰ chèn header (:9/:79). stdout chỉ có banner npm.
          # Bản cũ `npm run gen:types > /tmp/x.ts` hỏng cả hai vế: vế phải là banner, vế trái
          # đã bị script ghi đè trước khi diff chạy ⇒ job luôn exit 1. Phải sao lưu trước.
          #
          # PHẢI CHUẨN HOÁ TRƯỚC KHI DIFF — đây là lỗi thứ hai của cùng bước này, sửa
          # 12/08/2026. `gen:types` sinh bản THÔ (32.985 dòng, gồm 92 partition
          # `*_YYYYMMDD` của bảng mẫu realtime), còn file được commit là bản ĐÃ BỎ
          # partition (28.569 dòng — xem `npm run types:normalize`, và Contract §6 quy
          # định đúng thứ tự gen → normalize → check). Thiếu bước normalize thì diff luôn
          # lệch đúng 92 bảng đó, tức job KHÔNG BAO GIỜ xanh được dù schema khớp hoàn
          # toàn. Đã đo: sau khi thêm normalize, diff rỗng trên cùng SHA mà CI báo trôi.
          cp src/integrations/supabase/types.ts /tmp/types.committed.ts
          npm run gen:types
          npm run types:normalize
          diff -u /tmp/types.committed.ts src/integrations/supabase/types.ts \
            && echo "✅ types.ts khớp schema DB — không trôi." \
            || { echo "❌ types.ts TRÔI so với schema thật — chạy: npm run gen:types (script tự ghi + tự thêm header, KHÔNG redirect)"; exit 1; }


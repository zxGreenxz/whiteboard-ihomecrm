  secret-scan:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() &&
      github.ref != 'refs/heads/production' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.preflight.outputs.pr_da_xanh == 'true')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cài gitleaks (pin version + sha256)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Chốt chặn xanh-rỗng — phải thật sự có lịch sử để quét
        run: |
          set -euo pipefail
          COMMITS=$(git rev-list --count HEAD)
          echo "Lịch sử: $COMMITS commit"
          if [ "$COMMITS" -lt 500 ]; then
            echo "::error::Chỉ thấy $COMMITS commit (sàn 500). Checkout nông ⇒ 'no leaks found' là vô nghĩa."
            exit 1
          fi

      - name: Quét toàn lịch sử
        run: /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .

  # Bỏ qua khi thay đổi chỉ chạm tài liệu (bộ lọc ở job preflight). Bộ lọc mặc
  # định TRẢ TRUE khi không đo được diff, nên "bỏ qua" chỉ xảy ra lúc đã nhìn thấy
  # đúng danh sách file đổi.
  realtime-gates:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      github.ref != 'refs/heads/production' &&
      needs.preflight.outputs.ma_nguon == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'

      - name: Cài phụ thuộc
        run: npm ci

      - name: Bảng realtime hub lắng nghe đều được publish
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-realtime-descriptors.mjs

  production-promotion:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lấy về cả main để so
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Mọi commit đang phát hành đều đã qua main
        run: node scripts/check-production-promotion.mjs

      - name: Kết luận gate của commit đang phát hành
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/promote-to-production.mjs --sha "${{ github.sha }}" --wait-seconds 420

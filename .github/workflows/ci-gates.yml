          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        run: node scripts/ci-run-gates.mjs --job strict-islands-gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-strict-islands-gate-attempt-${{ github.run_attempt }}
          path: .gate-evidence/strict-islands-gate/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  timezone-gate:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'timezone-gate')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        run: node scripts/ci-run-gates.mjs --job timezone-gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-timezone-gate-attempt-${{ github.run_attempt }}
          path: .gate-evidence/timezone-gate/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  security-gates:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'security-gates')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        env:
          SUPABASE_PAT: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_PAT || '' }}
        run: node scripts/ci-run-gates.mjs --job security-gates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-security-gates-attempt-${{ github.run_attempt }}
          path: .gate-evidence/security-gates/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  generated-types-drift:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'generated-types-drift')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:

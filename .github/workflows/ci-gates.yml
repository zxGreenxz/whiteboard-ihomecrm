# Scope and commands have one owner: gate-plan + gate-registry.
# Only the always-running aggregate is release evidence; missing checks fail closed.
# Jobs fetch this attempt's plan before npm ci, so "Re-run failed jobs" (no new
# preflight plan) stops fast and asks for "Re-run all jobs".
name: CI Gates
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, production, 'release/*']
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-gates-${{ github.workflow }}-${{ github.ref }}
  # main never cancels: a cancelled push run leaves that commit's gates unproven
  # while a later push only plans its own diff. PR runs may still cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  preflight:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      needs_demo_browser: ${{ steps.plan.outputs.needs_demo_browser }}
      needs_docs_build: ${{ steps.plan.outputs.needs_docs_build }}
      needs_deno: ${{ steps.plan.outputs.needs_deno }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - id: plan
        name: Plan selected gates for exact checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-gate-plan.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-plan-attempt-${{ github.run_attempt }}
          path: .gate-evidence/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  quality-gates:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&
      contains(fromJSON(needs.preflight.outputs.required_jobs || '[]'), 'quality-gates')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        if: needs.preflight.outputs.needs_deno == 'true'
        with:
          deno-version: 2.9.4
      - name: Install docs dependencies only for a selected docs build
        if: needs.preflight.outputs.needs_docs_build == 'true'
        run: npm ci --prefix docs-site
      - name: Install browser for the selected offline suite only
        if: needs.preflight.outputs.needs_demo_browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: Execute selected gates and write receipts
        run: node scripts/ci-run-gates.mjs --job quality-gates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-receipts-quality-gates-attempt-${{ github.run_attempt }}
          path: .gate-evidence/quality-gates/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  vitest-tests:
    runs-on: ubuntu-latest
    needs: preflight
    if: >-
      !cancelled() && github.ref != 'refs/heads/production' &&
      needs.preflight.result == 'success' &&

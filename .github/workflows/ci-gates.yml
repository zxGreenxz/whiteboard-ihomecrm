      - name: Download exact-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-download-plan.mjs
      - run: npm ci

      - name: Execute selected gates and write receipts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_ACCESS_TOKEN || '' }}
        run: node scripts/ci-run-gates.mjs --job generated-types-drift
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()

name: OpenClaw Task 12 Ephemeral Supabase Reset

on:
  push:
    branches:
      - codex/openclaw-task12-ephemeral-ci
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openclaw-task12-ephemeral-reset
  cancel-in-progress: true

jobs:
  full-local-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Pin Supabase CLI
        run: |
          version="$(npx --yes supabase@2.109.1 --version)"
          test "$version" = "2.109.1"

      - name: Build a byte-preserving unique-version migration copy
        shell: bash
        run: |
          set -euo pipefail
          reset_root="$RUNNER_TEMP/openclaw-task12-reset"
          migration_root="$reset_root/supabase/migrations"
          mkdir -p "$migration_root"
          cp supabase/config.toml "$reset_root/supabase/config.toml"
          sed -i \
            's/^project_id = .*/project_id = "openclaw_task12_ephemeral"/' \
            "$reset_root/supabase/config.toml"

          mapfile -d '' sources < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
              -print0 | sort -z
          )
          test "${#sources[@]}" -eq 498

          : > "$reset_root/migration-byte-manifest.txt"
          index=0
          for source in "${sources[@]}"; do
            index=$((index + 1))
            version=$((80000000000000 + index))
            original="$(basename "$source")"
            target="$migration_root/${version}_${original}"
            cp -- "$source" "$target"
            sha256sum "$source" \
              | sed "s#  supabase/migrations/#  #" \
              >> "$reset_root/migration-byte-manifest.txt"
          done
          test "$(wc -l < "$reset_root/migration-byte-manifest.txt")" -eq 498

      - name: Start and reset the complete repository migration chain
        shell: bash
        run: |
          set +e
          reset_root="$RUNNER_TEMP/openclaw-task12-reset"
          (
            set -e
            npx --yes supabase@2.109.1 db start --workdir "$reset_root"
            npx --yes supabase@2.109.1 db reset --local --no-seed --debug \
              --workdir "$reset_root"
          ) 2>&1 | tee /tmp/openclaw-task12-reset.log
          reset_code="${PIPESTATUS[0]}"

          {
            echo "reviewed_commit=$GITHUB_SHA"
            echo "reset_exit_code=$reset_code"
            echo "migration_file_count=498"
            echo "migration_manifest_sha256=$(sha256sum "$reset_root/migration-byte-manifest.txt" | cut -d' ' -f1)"
            echo "diagnostic_begin"
            grep -Eai 'error|failed|duplicate|migration|does not exist|syntax' \
              /tmp/openclaw-task12-reset.log \
              | tail -n 100 \
              | sed -E \
                  -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[REDACTED]#g' \
                  -e 's#eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#[REDACTED_JWT]#g'
            echo "diagnostic_end"
          } > openclaw-task12-reset-result.txt

          git config user.name "OpenClaw Task 12 CI"
          git config user.email "noreply@openai.com"
          result_branch="codex/openclaw-task12-result-${GITHUB_SHA:0:12}"
          git switch -c "$result_branch"
          git add openclaw-task12-reset-result.txt
          git commit -m "ci(openclaw-zalo): record ephemeral reset result"
          git push origin "HEAD:refs/heads/$result_branch"
          exit "$reset_code"

      - name: Destroy disposable local Supabase state
        if: always()
        run: |
          npx --yes supabase@2.109.1 stop --no-backup \
            --workdir "$RUNNER_TEMP/openclaw-task12-reset" || true

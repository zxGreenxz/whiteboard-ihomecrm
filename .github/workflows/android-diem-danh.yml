name: Android Diem Danh
on:
  pull_request:
    paths: ['extensions/diem-danh/android/**', '.github/workflows/android-diem-danh.yml', 'tooling/test-matrix.json', 'tooling/runtime-matrix.json']
  push:
    branches: [main, 'release/*']
    paths: ['extensions/diem-danh/android/**', '.github/workflows/android-diem-danh.yml', 'tooling/test-matrix.json', 'tooling/runtime-matrix.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-diem-danh-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    name: Android APK and native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build APK and run Android unit and lint checks
        run: bash extensions/diem-danh/android/ci-build.sh
      - name: Prepare disposable Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-35;google_apis;x86_64' 'system-images;android-29;google_apis;x86_64' < /dev/null
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify encrypted queue, alarms and capture on device
        run: bash extensions/diem-danh/android/ci-device.sh
      - name: Sign installable APK on the reviewed main branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IHOME_BANK_ANDROID_KEYSTORE_B64: ${{ secrets.IHOME_BANK_ANDROID_KEYSTORE_B64 }}
          IHOME_BANK_ANDROID_PASSWORD: ${{ secrets.IHOME_BANK_ANDROID_PASSWORD }}
        run: bash extensions/diem-danh/android/ci-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ihome-diem-danh-${{ github.sha }}
          path: |
            extensions/diem-danh/android/app/build/outputs/apk/debug/app-debug.apk
            extensions/diem-danh/android/app/build/reports/tests/testDebugUnitTest/
            extensions/diem-danh/android/app/build/reports/lint-results-debug.html
            extensions/diem-danh/android/app/build/outputs/androidTest-results/connected/
            extensions/diem-danh/android/build/ci-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: ihome-diem-danh-release-${{ github.sha }}
          path: |
            extensions/diem-danh/android/app/build/outputs/apk/release/app-release.apk
            extensions/diem-danh/android/build/release-evidence/
          if-no-files-found: error
          retention-days: 30

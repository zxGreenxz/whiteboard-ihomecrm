name: Supabase Migration

on:
  workflow_dispatch:
    inputs:
      tranche_id:
        description: 'Approved tranche ID (for example T1A)'
        required: true
        type: string
      commit_sha:
        description: 'Exact full commit SHA to deploy'
        required: true
        type: string
      migration_path:
        description: 'Exact migration path under supabase/migrations/'
        required: true
        type: string
      migration_sha256:
        description: 'Expected lowercase SHA-256 of the migration file'
        required: true
        type: string
      backup_certification_id:
        description: 'VERIFIED recovery-set certification ID'
        required: true
        type: string
      maintenance_window_id:
        description: 'Approved production maintenance-window ID'
        required: true
        type: string
      confirm:
        description: 'Type APPLY_PRODUCTION exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirm == 'APPLY_PRODUCTION'
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Validate immutable deployment inputs
        shell: bash
        env:
          TRANCHE_ID: ${{ inputs.tranche_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          MIGRATION_PATH: ${{ inputs.migration_path }}
          MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
          BACKUP_CERTIFICATION_ID: ${{ inputs.backup_certification_id }}
          MAINTENANCE_WINDOW_ID: ${{ inputs.maintenance_window_id }}
        run: |
          set -euo pipefail
          [[ "$TRANCHE_ID" =~ ^T[0-9]+[A-Za-z0-9._-]*$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MIGRATION_PATH" =~ ^supabase/migrations/[0-9]{14}_[A-Za-z0-9_-]+\.sql$ ]]
          [[ "$MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BACKUP_CERTIFICATION_ID" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$MAINTENANCE_WINDOW_ID" =~ ^[A-Za-z0-9._:-]+$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out commit and migration hash
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          MIGRATION_PATH: ${{ inputs.migration_path }}
          MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test -f "$MIGRATION_PATH"
          test "$(sha256sum "$MIGRATION_PATH" | cut -d' ' -f1)" = "$MIGRATION_SHA256"

      - name: Apply the exact reviewed migration
        shell: bash
        env:
          MIGRATION_PATH: ${{ inputs.migration_path }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --single-transaction \
            --file "$MIGRATION_PATH"

      - name: Record deployment evidence
        if: always()
        shell: bash
        env:
          TRANCHE_ID: ${{ inputs.tranche_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          MIGRATION_PATH: ${{ inputs.migration_path }}
          MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
          BACKUP_CERTIFICATION_ID: ${{ inputs.backup_certification_id }}
          MAINTENANCE_WINDOW_ID: ${{ inputs.maintenance_window_id }}
        run: |
          printf '%s\n' \
            "tranche_id=$TRANCHE_ID" \
            "commit_sha=$COMMIT_SHA" \
            "migration_path=$MIGRATION_PATH" \
            "migration_sha256=$MIGRATION_SHA256" \
            "backup_certification_id=$BACKUP_CERTIFICATION_ID" \
            "maintenance_window_id=$MAINTENANCE_WINDOW_ID" \
            >> "$GITHUB_STEP_SUMMARY"

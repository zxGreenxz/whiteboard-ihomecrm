name: Hermes synthetic runtime

# No environment, repository secrets, CRM, Zalo or paid-model credentials.
# This proves the pinned upstream runtime against disposable synthetic fixtures.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-runtime.yml'
      - 'infra/hermes-runtime/**'
      - 'infra/hermes-broker/**'
      - 'infra/hermes-zalo-native/**'
      - 'worker/deploy/**'
      - 'worker/Dockerfile'
      - 'worker/.dockerignore'
      - 'worker/lib/hermes-native-*.js'
      - 'worker/lib/hermes-link.js'
      - 'package.json'
      - 'scripts/test-hermes-native-ci.mjs'
      - 'scripts/test-hermes-runtime-isolation.mjs'
  pull_request:
    paths:
      - '.github/workflows/hermes-runtime.yml'
      - 'infra/hermes-runtime/**'
      - 'infra/hermes-broker/**'
      - 'infra/hermes-zalo-native/**'
      - 'worker/deploy/**'
      - 'worker/Dockerfile'
      - 'worker/.dockerignore'
      - 'worker/lib/hermes-native-*.js'
      - 'worker/lib/hermes-link.js'
      - 'package.json'
      - 'scripts/test-hermes-native-ci.mjs'
      - 'scripts/test-hermes-runtime-isolation.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Read reviewed upstream source and image pins
        id: pins
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { HERMES_IMAGE, HERMES_COMMIT, assertImageProvenance } from './infra/hermes-runtime/runtime-contract.mjs';
          assertImageProvenance(JSON.parse(readFileSync('infra/hermes-runtime/image-provenance.json', 'utf8')));
          appendFileSync(process.env.GITHUB_OUTPUT, `image=${HERMES_IMAGE}\ncommit=${HERMES_COMMIT}\n`);
          NODE
      - name: Retrieve exact upstream checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.pins.outputs.commit }}
          path: .cache/hermes-native-upstream
          persist-credentials: false
      - name: Retrieve and verify pinned runtime dependencies
        timeout-minutes: 9
        env:
          HERMES_NATIVE_IMAGE: ${{ steps.pins.outputs.image }}
        run: |
          timeout 480s docker pull --platform linux/amd64 "$HERMES_NATIVE_IMAGE"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { HERMES_IMAGE, assertPinnedImageInspection } from './infra/hermes-runtime/runtime-contract.mjs';
          const [image] = JSON.parse(execFileSync('docker', ['image', 'inspect', HERMES_IMAGE], { encoding: 'utf8', timeout: 15000 }));
          assertPinnedImageInspection(image, JSON.parse(readFileSync('infra/hermes-runtime/image-provenance.json', 'utf8')));
          NODE
      - name: Require Linux deployment, native bridge, journal, operator and upstream retry recovery tests
        timeout-minutes: 7
        env:
          HERMES_NATIVE_IMAGE: ${{ steps.pins.outputs.image }}
        run: |
          set -euo pipefail
          container="hermes-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uid="$(id -u)"
          gid="$(id -g)"
          test "$uid" -gt 0
          test "$gid" -gt 0
          trap 'result=$?; timeout 30s docker rm --force --volumes "$container" || result=1; exit "$result"' EXIT
          # Only reviewed source mounts; all test state lives in a private tmpfs.
          timeout 30s docker create --name "$container" --platform linux/amd64 \
            --network none --user "$uid:$gid" --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 1536m --cpus 1 \
            --tmpfs "/tmp:rw,nosuid,nodev,noexec,size=268435456,mode=0700,uid=$uid,gid=$gid" \
            --tmpfs /opt/data:ro,nosuid,nodev,noexec,size=1048576 \
            --mount "type=bind,src=$PWD/package.json,dst=/fixture/package.json,readonly" \
            --mount "type=bind,src=$PWD/worker/lib,dst=/fixture/worker/lib,readonly" \
            --mount "type=bind,src=$PWD/worker/deploy,dst=/fixture/worker/deploy,readonly" \
            --mount "type=bind,src=$PWD/worker/Dockerfile,dst=/fixture/worker/Dockerfile,readonly" \
            --mount "type=bind,src=$PWD/worker/.dockerignore,dst=/fixture/worker/.dockerignore,readonly" \
            --mount "type=bind,src=$PWD/infra/hermes-zalo-native,dst=/fixture/infra/hermes-zalo-native,readonly" \
            --mount "type=bind,src=$PWD/infra/hermes-runtime/runtime-contract.mjs,dst=/fixture/infra/hermes-runtime/runtime-contract.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/test-hermes-native-ci.mjs,dst=/fixture/scripts/test-hermes-native-ci.mjs,readonly" \
            --mount "type=bind,src=$PWD/.cache/hermes-native-upstream,dst=/upstream,readonly" \
            --env HOME=/tmp --env HERMES_HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 \
            --env HERMES_TEST_UPSTREAM=/upstream --env HERMES_TEST_PYTHON=/opt/hermes/.venv/bin/python \
            --workdir /fixture --entrypoint /usr/local/bin/node \
            "$HERMES_NATIVE_IMAGE" scripts/test-hermes-native-ci.mjs
          timeout --signal=TERM --kill-after=10s 360s docker start --attach "$container"
  synthetic-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Check fixture controls and verifier failure cases
        run: node --test infra/hermes-runtime/runtime-contract.test.mjs infra/hermes-runtime/fixture-server.test.mjs infra/hermes-runtime/profile-lease.test.mjs
      - name: Run pinned Hermes AIAgent with separate A and B containers
        run: node scripts/test-hermes-runtime-isolation.mjs --run
      - name: Preserve bounded JSON evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-runtime-receipts-${{ github.run_attempt }}
          path: |
            .cache/hermes-p1/hermes-p1-*/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

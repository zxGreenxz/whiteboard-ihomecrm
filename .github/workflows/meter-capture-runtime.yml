name: Meter capture CPU runtime

# Synthetic fixtures only. No environments, repository secrets, backend or paid AI.
on:
  pull_request:
    paths:
      - '.github/workflows/meter-capture-runtime.yml'
      - 'infra/meter-capture-worker/**'
      - 'tooling/runtime-matrix.json'
      - 'tooling/test-matrix.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/meter-capture-runtime.yml'
      - 'infra/meter-capture-worker/**'
      - 'tooling/runtime-matrix.json'
      - 'tooling/test-matrix.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meter-capture-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cpu-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Build pinned worker and verify synthetic OCR and clip decoding offline
        run: node --test infra/meter-capture-worker/runtime.test.mjs

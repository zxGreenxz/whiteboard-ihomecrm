name: Kiểm soát ngoài repo

# VÌ SAO CHẠY ĐỊNH KỲ, không chỉ chạy theo push
#
#   Các control ở đây nằm NGOÀI git: Vercel production branch, branch protection,
#   env var. Không commit nào làm chúng đổi, nên chạy theo push là chạy sai nhịp —
#   một control bị tắt trên dashboard lúc 3 giờ chiều sẽ im lặng cho tới lần push
#   tiếp theo, mà lần đó có thể là tuần sau.
#
#   Ảnh chụp chứng minh "lúc đó đã bật", không chứng minh "bây giờ vẫn bật". Chỉ
#   thứ hai mới giữ production an toàn.
#
# CẦN SECRET, VÀ NẾU THIẾU THÌ NÓI THẲNG
#
#   Script coi thiếu credential là `unverified`, KHÔNG phải pass — và unverified
#   được đối xử như chưa an toàn. Nên workflow này chạy được cả khi chưa có secret:
#   nó sẽ báo unverified mỗi lần, và đó chính là lời nhắc rằng kiểm soát cứng DUY
#   NHẤT của repo (branch protection không enforce được trên GitHub Free) đang
#   không có ai canh.
#
#   Để nó kiểm được thật, thêm hai secret ở Settings → Secrets and variables →
#   Actions:
#     VERCEL_TOKEN  — token đọc project/env/deployment (chỉ cần quyền đọc)
#     GH_TOKEN      — hoặc để trống và dựa vào GITHUB_TOKEN mặc định
#
#   Script CHỈ đọc TÊN env var và target, không bao giờ đọc giá trị: bằng chứng
#   được commit, nên một lần lỡ tay là secret nằm vĩnh viễn trong lịch sử git.

on:
  schedule:
    # 03:17 UTC mỗi ngày. Cố ý lệch khỏi :00 — mọi job trên GitHub Actions đều dồn
    # vào đầu giờ, và job xếp hàng lâu hay bị bỏ.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Cần lịch sử để kiểm SHA đang chạy production có nằm trên main không.
          # Checkout nông sẽ làm phép kiểm đó thành "không kiểm được".
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      # BẮT BUỘC: bước "Hạn của known-gaps" chạy scripts/check-known-gaps.mjs, mà
      # script đó `import yaml from 'js-yaml'`. Thiếu bước này, workflow ĐỎ ở MỌI
      # lượt cron với `ERR_MODULE_NOT_FOUND` — đã xảy ra thật ít nhất 3 ngày liên
      # tiếp (28, 29, 30/08/2026), tức một cửa chặn đã câm mà không ai nhận ra.
      - name: Cài dependency
        run: npm ci

      - name: Kiểm soát ngoài repo
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-external-controls.mjs

      # BẰNG CHỨNG ĐI LÊN ARTIFACT, KHÔNG COMMIT NGƯỢC VÀO MAIN.
      #
      # Plan đề xuất "commit lại evidence JSON" mỗi lượt chạy. Không làm vậy, vì
      # ba lý do đo được:
      #
      #   1. Nó mâu thuẫn với chính mô hình phát hành của repo: main là nhánh mà
      #      mọi commit đều đã qua gate và có người xem. Một bot đẩy commit vào đó
      #      hằng đêm phá đúng tính chất ấy.
      #   2. `contents: write` cho một job có VERCEL_TOKEN và GH_TOKEN là mở rộng
      #      quyền cho một job vốn chỉ cần ĐỌC.
      #   3. Evidence đổi mỗi ngày (timestamp, deployment id) nên lịch sử git sẽ
      #      đầy commit không ai đọc — và khi nhiễu đủ nhiều thì thay đổi THẬT
      #      trong đó cũng chìm theo.
      #
      # Artifact giữ được 90 ngày, đủ để truy ngược, mà không đụng lịch sử. Bản
      # trong repo cập nhật khi có người chạy tay và xem qua.
      - name: Lưu bằng chứng thành artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-controls-${{ github.run_id }}
          path: docs/generated/external-controls.json
          retention-days: 90

      # Control ngoài repo vừa ĐỔI mà không commit nào gây ra — đúng thứ workflow
      # này sinh ra để bắt, nên nó ĐỎ chứ không phải một dòng ::warning::.
      #
      # Bỏ qua `checkedAt` và SHA deployment: cái đầu đổi mỗi lượt chạy, cái sau
      # đổi mỗi lần phát hành. Nếu tính cả hai thì job đỏ thường trực, và một job
      # đỏ thường trực là job người ta ngừng đọc — lúc đó control có bị tắt thật
      # cũng không ai thấy.
      # env PHẢI có mặt Ở CẢ BƯỚC NÀY: bước so sánh cũng ĐO LẠI từ đầu. Thiếu
      # token thì nó đo ra "unverified" cho mọi control rồi so với snapshot đã
      # đo CÓ token → lệch ~56 dòng ở MỌI lượt cron (đỏ hệ thống 01/09/2026,
      # dễ đọc nhầm thành "ai đó bấm dashboard").
      - name: Kiểm soát ngoài repo có đổi so với bản đã commit không
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-external-controls.mjs --so-ban-commit

      # Hạn của known-gaps thuộc đúng loại control ở workflow này: KHÔNG commit nào
      # làm một ngày hết hạn trôi qua. Chạy theo push thì hoặc không bao giờ bắt
      # được, hoặc bắt được vào đúng PR của một người chẳng liên quan.
      #
      # Vì sao `--strict` ở ĐÂY mà không phải trong ci-gates: chú thích đầu
      # check-known-gaps.mjs đã cân nhắc và kết luận đúng — một gate chặn merge vì
      # ngày tháng sẽ bị gia hạn theo nghi thức, hoặc bị tắt, và khi ấy mất luôn tín
      # hiệu. Cờ --strict có từ đầu nhưng CHƯA TỪNG có lượt chạy định kỳ nào gọi nó,
      # nên cưỡng chế hạn cho tới hôm nay chỉ tồn tại trên giấy (đo 11/08/2026: gap
      # quá hạn → exit 0).
      #
      # `if: always()` để bước này vẫn chạy khi kiểm soát ngoài repo đã đỏ — hai
      # phép đo độc lập, không cái nào được nuốt cái kia.
      - name: Hạn của known-gaps (cưỡng chế, chỉ ở lượt chạy định kỳ)
        if: always()
        run: node scripts/check-known-gaps.mjs --strict

      # Dự phòng partition cũng là loại control chạy theo THỜI GIAN, không theo
      # commit: partition mới nhất lùi dần về hôm nay mà không ai sửa gì cả. Khi
      # nó tụt lại phía sau, MỌI insert telemetry lỗi cùng lúc — hỏng không dần,
      # nên phải bắt trước bằng một lượt chạy hằng ngày.
      #
      # Thiếu PAT ⇒ exit 3, không phải "còn đủ partition".
      - name: Dự phòng partition telemetry
        if: always()
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-partition-runway.mjs

# Kiểm control ngoài Git mỗi ngày; chỉ đọc dữ liệu và lưu bằng chứng vào artifact.
# Thiếu credential phải báo chưa xác minh; không coi là đã đạt kiểm soát.

name: Kiểm soát ngoài repo

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Cài dependency
        run: npm ci

      - name: Kiểm soát ngoài repo
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/check-external-controls.mjs

      - name: Lưu bằng chứng thành artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-controls-${{ github.run_id }}
          path: docs/generated/external-controls.json
          retention-days: 90

      - name: Kiểm soát ngoài repo có đổi so với bản đã commit không
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/check-external-controls.mjs --so-ban-commit

      - name: Hạn của known-gaps (cưỡng chế, chỉ ở lượt chạy định kỳ)
        if: always()
        run: node scripts/check-known-gaps.mjs --strict

      - name: Dự phòng partition telemetry
        if: always()
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/check-partition-runway.mjs

# Explicit manual preflight. No database writes and no migration replay.
name: Organization context backup
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      recipient_public_key:
        description: Base64 RSA public key for the local backup recipient
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: org-context-database-maintenance
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && github.repository == 'zxGreenxz/whiteboard-ihomecrm' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Check reviewed commit and encryption recipient before using credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        run: |
          node --input-type=module -e "import {assertContext,recipientKey} from './scripts/org-context-repair/sealed-artifact.mjs'; assertContext({sha:process.env.GITHUB_SHA,expectedSha:process.env.EXPECTED_SHA,ref:process.env.GITHUB_REF,repository:process.env.GITHUB_REPOSITORY,eventName:process.env.GITHUB_EVENT_NAME}); recipientKey(process.env.RECIPIENT_PUBLIC_KEY);"
      - name: Pull pinned PostgreSQL client
        run: docker pull postgres:17.6
      - name: Verify sealed artifact regression tests before using credentials
        run: |
          npm ci
          node --test scripts/org-context-repair/sealed-artifact.test.mjs
      - name: Create verified full backup and read-only catalog snapshot
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: node scripts/org-context-repair/capture-backup.mjs
      - name: Retain only the encrypted backup and its integrity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: org-context-backup-${{ github.sha }}
          path: ${{ runner.temp }}/org-context-backup/
          if-no-files-found: error
          retention-days: 7

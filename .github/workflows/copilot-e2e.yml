# E2E Copilot — 3 spec chạy trên trình duyệt thật, KHÔNG chạy theo mỗi PR.
#
# VÌ SAO TÁCH RA KHỎI ci-gates.yml
#   Job quality-gates cố ý KHÔNG cần secret nào: nhờ vậy nó xanh trên mọi PR, kể
#   cả PR từ fork. Ba spec dưới đây cần mật khẩu tài khoản DEMO và một URL trỏ tới
#   bản build đang chạy — gộp vào đó là biến cửa bắt buộc thành cửa đỏ-vì-thiếu-
#   credential, và một cửa đỏ thường trực là cửa không ai còn đọc.
#
# SECRET PHẢI ĐƯỢC NẠP TAY (Settings → Secrets and variables → Actions)
#   - FLEET_BASE_URL       : URL bản dựng ĐANG chạy để thử. KHÔNG được là
#                            https://ptcrm.vercel.app — hai spec ghi dữ liệu gọi
#                            `chanChayTrenProduction()` và sẽ NÉM nếu thấy
#                            production (xem .e2e-fleet/specs/buildAttestation.ts).
#   - FLEET_PASS_CHUNHA    : mật khẩu demo.chunha@username.ihomecrm.local
#   - FLEET_PASS_KETOAN    : mật khẩu demo.ketoan@username.ihomecrm.local
#   - FLEET_PASS_QUANLY    : mật khẩu demo.quanly@username.ihomecrm.local
#   - FLEET_PASS_QUANLY2   : quản lý thứ hai. .e2e-fleet/specs/auth.ts CHƯA có
#                            khoá cho tài khoản này (02/09/2026) — nối sẵn ở đây
#                            để spec sau thêm vai đó mà không phải sửa workflow.
#   Thiếu secret nào thì spec NÉM với thông báo chỉ đúng tên biến, không fail mơ hồ.
#
# PHẠM VI GHI: CHỈ ORG DEMO (Contract §8)
#   Cả ba spec đăng nhập bằng tài khoản demo.* thuộc org DEMO (dddd…0001) và chỉ
#   ghi trong phạm vi đó. `COPILOT_DRAFT_MATRIX_LIVE=1` mở phần ma trận nháp có
#   GHI (preview nháp chưa duyệt) — vẫn trong org DEMO. Không có tài khoản của
#   công ty thật nào trong workflow này.
#
# BẢN NÀO ĐANG ĐƯỢC THỬ — VÌ SAO **KHÔNG** DÙNG `github.sha`
#   Mọi spec Copilot gọi `xacMinhBanBuild()`: nó so `EXPECTED_SOURCE_SHA` với thẻ
#   <meta name="build-sha"> của trang (index.html:12 ← VITE_BUILD_SHA, tức commit
#   mà Vercel đã DỰNG). `github.sha` là HEAD của nhánh lúc workflow chạy — hai số
#   này chỉ trùng khi nhánh không nhích kể từ lần deploy gần nhất. Bản đầu
#   (02/09/2026) đặt thẳng `github.sha`, và như vậy lượt cron ĐỎ THEO THIẾT KẾ:
#   mỗi commit mới vào main làm lượt đêm hôm đó thất bại vì lý do chẳng liên quan
#   gì tới Copilot — đúng kiểu đỏ thường trực khiến người ta ngừng đọc CI.
#
#   Cách đúng là hỏi chính bản đang chạy xem nó là ai, rồi kiểm SHA đó có thuộc
#   repo này không. Hai việc, hai lý do:
#     - đọc thẻ meta ⇒ so đúng thứ đang phục vụ người dùng, không phải thứ ta đoán;
#     - `git cat-file -e` ⇒ một FLEET_BASE_URL trỏ nhầm sang deployment của repo
#       KHÁC (hoặc một bản dựng từ lịch sử đã bị viết lại) bị chặn NGAY, thay vì
#       chạy trót lọt rồi báo cáo về một hệ thống khác. Thiếu dữ liệu là THẤT BẠI
#       chứ không phải "bỏ qua" — cùng luật với buildAttestation.ts.
#   Chạy tay có thể ép bằng input `expected_sha` (khi đang thử một preview cụ
#   thể); để trống thì tự dò.

name: Copilot E2E

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'SHA 40 hex của bản build đang chạy ở FLEET_BASE_URL. Để trống = tự đọc thẻ <meta name="build-sha"> của trang.'
        required: false
        type: string
  schedule:
    # 19:00 UTC = 02:00 giờ Việt Nam (UTC+7) — ngoài giờ làm việc.
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  group: copilot-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 — bước xác minh phía dưới cần TOÀN BỘ lịch sử để trả lời
      # được "SHA của bản deploy có thuộc repo này không". Với clone nông thì một
      # commit hợp lệ nhưng cũ vẫn trượt thành "không thuộc repo": phép kiểm báo
      # động giả, và một phép kiểm báo động giả sẽ bị tắt.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Cài dependency (npm ci — khớp package-lock.json)
        run: npm ci

      # .e2e-fleet KHÔNG có package.json riêng: nó dùng @playwright/test của root
      # (1.61.1). Chỉ cài chromium — ba spec này không chạy firefox/webkit.
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Xác định SHA của bản đang chạy ở FLEET_BASE_URL
        env:
          FLEET_BASE_URL: ${{ secrets.FLEET_BASE_URL }}
          SHA_NHAP: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ -z "${FLEET_BASE_URL:-}" ]; then
            echo "::error::Thieu secret FLEET_BASE_URL — khong biet dang thu ban nao."
            exit 1
          fi
          if [ -n "${SHA_NHAP:-}" ]; then
            sha="$SHA_NHAP"
            nguon="input expected_sha (chay tay)"
          else
            nguon="the meta build-sha cua $FLEET_BASE_URL"
            trang=$(curl -fsSL --max-time 60 "$FLEET_BASE_URL/")
            sha=$(printf '%s' "$trang" | grep -o 'build-sha"[[:space:]]*content="[0-9a-f]\{40\}' | head -1 | grep -o '[0-9a-f]\{40\}' || true)
          fi
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Khong lay duoc build SHA 40 hex (nguon: $nguon). Ban dang chay KHONG khai minh la ai — dung thieu VITE_BUILD_SHA/VERCEL_GIT_COMMIT_SHA."
            exit 1
          fi
          if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "::error::Ban deploy tai $FLEET_BASE_URL dung tu commit $sha, commit nay KHONG thuoc lich su repo nay. FLEET_BASE_URL dang tro nham he thong khac."
            exit 1
          fi
          echo "EXPECTED_SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "Ban dang chay: $sha (nguon: $nguon)"

      # KHÔNG sinh HTML report trên CI — `--reporter=list`, không `html`.
      #
      # ĐO 02/09/2026, Playwright 1.61.1, với `trace: 'off'` + `screenshot: 'off'`:
      #   (1) `playwright-report/data/<hash>.md` (attachment "error-context.md")
      #       chứa ARIA snapshot của trang, trong đó giá trị ô `type="password"`
      #       nằm NGUYÊN VĂN: `- textbox "Mat khau": SUPERSECRETPW123`. Sinh ra
      #       mỗi khi một test đỏ, không phụ thuộc cài đặt trace/screenshot.
      #   (2) Nặng hơn: `index.html` NHÚNG report JSON dưới dạng
      #       `data:application/zip;base64,…` (deflate). Trong đó có tiêu đề bước
      #       `"title":"Fill \"<giá trị>\" locator(...)"` — tức mật khẩu có mặt ở
      #       MỌI lượt chạy gọi `fill()`, kể cả lượt XANH, chứ không riêng lượt đỏ.
      #       Vì đã nén, `grep -rF "$mat_khau"` trên thư mục report luôn báo SẠCH.
      #       Một guard chỉ dựa vào grep sẽ tự tin gật đầu rồi tải mật khẩu lên.
      # Kết luận: dọn `data/` là CẦN nhưng KHÔNG ĐỦ; chừng nào mật khẩu còn đi qua
      # `fill()` thì report HTML không thể chứng minh là sạch. Nên CI không sinh nó.
      #
      # Đầu ra duy nhất được giữ là stdout của reporter `list` (đã đo: không chứa
      # giá trị đã điền — call log chỉ có selector và thông báo lỗi). Đủ để biết ca
      # nào đỏ và đỏ ở đâu.
      #
      # `--output` và thư mục log đặt TƯỜNG MINH trong $RUNNER_TEMP. Không phải cho
      # gọn: Playwright phân giải `playwright-report/`/`test-results/` mặc định
      # theo thư mục chứa **package.json gần nhất** (playwright/lib/util.js:243),
      # mà `.e2e-fleet/` KHÔNG có package.json — nên chúng rơi vào GỐC REPO chứ
      # không phải `.e2e-fleet/`. Bản trước tải lên `.e2e-fleet/playwright-report/`
      # và sẽ luôn nhận được thư mục rỗng.
      - name: 3 spec Copilot (readonly smoke · xác nhận · ma trận nháp)
        env:
          FLEET_BASE_URL: ${{ secrets.FLEET_BASE_URL }}
          FLEET_PASS_CHUNHA: ${{ secrets.FLEET_PASS_CHUNHA }}
          FLEET_PASS_KETOAN: ${{ secrets.FLEET_PASS_KETOAN }}
          FLEET_PASS_QUANLY: ${{ secrets.FLEET_PASS_QUANLY }}
          FLEET_PASS_QUANLY2: ${{ secrets.FLEET_PASS_QUANLY2 }}
          # 2 worker: đủ song song để suite không lê thê, đủ ít để 3 tài khoản
          # DEMO không tự đá nhau khi cùng ghi nháp trong một org.
          FLEET_WORKERS: '2'
          # Mở 2 test ghi nháp trong copilot-draft-matrix.spec.ts. Cờ này nằm
          # trong spec (`test.skip` khi khác '1') — KHÔNG gỡ cờ, chỉ đặt env.
          COPILOT_DRAFT_MATRIX_LIVE: '1'
          # EXPECTED_SOURCE_SHA đến từ $GITHUB_ENV của bước trên. Cố ý KHÔNG khai
          # lại ở đây: env cấp-bước sẽ ĐÈ giá trị đó và ta quay về đúng lỗi cũ.
          THU_MUC_TAI_LEN: ${{ runner.temp }}/copilot-e2e
          THU_MUC_RAC: ${{ runner.temp }}/copilot-e2e-artifacts
        run: |
          set -uo pipefail
          mkdir -p "$THU_MUC_TAI_LEN"
          cd .e2e-fleet
          npx playwright test \
            specs/copilot-readonly-smoke.spec.ts \
            specs/copilot-confirmation.spec.ts \
            specs/copilot-draft-matrix.spec.ts \
            --reporter=list \
            --trace=off \
            --output "$THU_MUC_RAC" 2>&1 | tee "$THU_MUC_TAI_LEN/list.log"

      # Dọn TRƯỚC guard, guard TRƯỚC upload. Ba bước tách rời để log nói rõ bước
      # nào làm gì; gộp lại thì một lần `rm` hỏng sẽ ẩn trong bước khác.
      #
      # Lệnh `find … -delete` giữ đúng như review yêu cầu, và chạy trên MỌI vị trí
      # report có thể rơi vào (xem chú thích package.json ở trên). Sau đó xoá hẳn
      # cả report lẫn test-results: không thứ nào trong đó được tải lên, và thứ
      # không tồn tại thì không rò rỉ được.
      - name: Dọn mọi artifact Playwright có thể mang giá trị đã điền
        if: always()
        env:
          THU_MUC_RAC: ${{ runner.temp }}/copilot-e2e-artifacts
        run: |
          set -uo pipefail
          for bc in playwright-report .e2e-fleet/playwright-report; do
            [ -d "$bc/data" ] || continue
            truoc=$(find "$bc/data" -type f | wc -l)
            find "$bc/data" -type f ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' ! -name '*.webp' -delete
            echo "Don attachment $bc/data: $truoc file -> $(find "$bc/data" -type f | wc -l)"
          done
          rm -rf playwright-report .e2e-fleet/playwright-report test-results .e2e-fleet/test-results "$THU_MUC_RAC"
          echo "Da xoa report HTML + test-results (khong buoc nao tai chung len)."

      # Guard: thứ SẮP tải lên phải CHỨNG MINH ĐƯỢC là sạch, không chỉ "trông sạch".
      # Hai phép, vì một phép không đủ:
      #   - grep nguyên văn từng mật khẩu ⇒ bắt bản rõ;
      #   - chặn mọi file có `data:application/zip;base64,` ⇒ bắt thứ grep KHÔNG
      #     đọc nổi. Report HTML của Playwright nhúng report JSON đã nén ở đúng
      #     dạng đó, và tiêu đề bước `Fill "<giá trị>"` nằm trong. Cố ý KHÔNG giải
      #     nén để "kiểm cho kỹ": không chứng minh được sạch thì KHÔNG tải lên.
      # `grep -q` nên nội dung khớp không bị in ra log.
      - name: Guard — artifact không được chứa mật khẩu DEMO
        id: guard
        if: always()
        env:
          THU_MUC_TAI_LEN: ${{ runner.temp }}/copilot-e2e
          FLEET_PASS_CHUNHA: ${{ secrets.FLEET_PASS_CHUNHA }}
          FLEET_PASS_KETOAN: ${{ secrets.FLEET_PASS_KETOAN }}
          FLEET_PASS_QUANLY: ${{ secrets.FLEET_PASS_QUANLY }}
          FLEET_PASS_QUANLY2: ${{ secrets.FLEET_PASS_QUANLY2 }}
        run: |
          set -uo pipefail
          if [ ! -d "$THU_MUC_TAI_LEN" ]; then
            echo "Khong co thu muc tai len — khong co gi de canh."
            exit 0
          fi
          loi=0
          for ten in FLEET_PASS_CHUNHA FLEET_PASS_KETOAN FLEET_PASS_QUANLY FLEET_PASS_QUANLY2; do
            mk="${!ten:-}"
            [ -n "$mk" ] || continue
            if grep -rqF -- "$mk" "$THU_MUC_TAI_LEN"; then
              echo "::error::artifact chua mat khau DEMO ($ten) — khong upload"
              loi=1
            fi
          done
          if grep -rqF -- 'data:application/zip;base64,' "$THU_MUC_TAI_LEN"; then
            echo "::error::artifact chua report nhung zip (grep khong kiem duoc) — khong upload"
            loi=1
          fi
          if [ "$loi" -ne 0 ]; then
            rm -rf "$THU_MUC_TAI_LEN"
            exit 1
          fi
          echo "Guard: khong thay mat khau nao trong $THU_MUC_TAI_LEN."

      # `!cancelled() && guard == success`: vẫn tải lên khi suite ĐỎ (đó là lúc log
      # có giá trị nhất), nhưng KHÔNG tải khi guard chưa chạy hoặc vừa bắt được rò
      # rỉ. `if: always()` trần sẽ tải lên kể cả sau khi guard đỏ — đúng thứ guard
      # sinh ra để chặn.
      - name: Tải lên log của reporter list (đã qua guard)
        if: ${{ !cancelled() && steps.guard.conclusion == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: copilot-e2e-log
          path: ${{ runner.temp }}/copilot-e2e/
          if-no-files-found: warn
          retention-days: 14

plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('IHOME_SIGNING_STORE')
def releasePassword = System.getenv('IHOME_SIGNING_PASSWORD')
def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (!releaseStorePath || !releasePassword || !file(releaseStorePath).isFile()) {
            throw new GradleException('Release signing requires IHOME_SIGNING_STORE and IHOME_SIGNING_PASSWORD.')
        }
    }
}

android {
    namespace 'vn.ihome.diemdanh'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'vn.ihome.diemdanh'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseStorePath) storeFile file(releaseStorePath)
            storePassword releasePassword
            keyAlias 'ihome-gateway'
            keyPassword releasePassword
        }
    }

    buildTypes {
        debug {
            // Installs next to the release app and talks to the TEST project only.
            applicationIdSuffix '.thu'
            resValue 'string', 'app_name', 'iHome Điểm danh (thử)'
            buildConfigField 'String', 'INGEST_ENDPOINT', '"https://hzulujxgonszuleqticb.supabase.co/functions/v1/gps-checkin-ingest"'
        }
        release {
            signingConfig signingConfigs.release
            resValue 'string', 'app_name', 'iHome Điểm danh'
            buildConfigField 'String', 'INGEST_ENDPOINT', '"https://tryymsxyyckgbrmmvozx.supabase.co/functions/v1/gps-checkin-ingest"'
        }
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn validateReleaseSigning
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    testImplementation 'junit:junit:4.13.2'
    // android.jar only ships throwing stubs of org.json; the JVM tests need the real classes.
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
